<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مشالى للالكترونيات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="logo">
                <i class="fas fa-bolt"></i> مشالى للالكترونيات
            </a>
            
            <div style="display: flex; gap: 12px; align-items: center;">
                <a href="https://wa.me/201551831308" class="whatsapp-link">
                    <i class="fab fa-whatsapp"></i> 01551831308
                </a>
                <div class="theme-switcher">
                    <span onclick="changeTheme('light')" style="cursor:pointer">☀️</span>
                    <span onclick="changeTheme('dark')" style="cursor:pointer; margin-right:8px;">🌙</span>
                </div>
            </div>
        </div>
        
        <nav>
            <ul class="nav-main" id="categories-nav">
                </ul>
            <div class="nav-actions">
                <div onclick="toggleCart()" style="cursor:pointer; position:relative;">
                    <i class="fas fa-shopping-cart" style="font-size: 1.2rem;"></i>
                    <span id="cart-badge" style="position:absolute; top:-8px; right:-10px; background:red; color:white; border-radius:50%; padding:1px 5px; font-size:9px; font-weight:bold;">0</span>
                </div>
            </div>
        </nav>
    </header>

    <main class="products-container">
        <div class="products-grid" id="products-grid">
            </div>
    </main>

    <div id="cart-sidebar" class="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>سلة المشتريات</h3>
            <span onclick="toggleCart()" style="cursor:pointer; font-weight:bold;">✕</span>
        </div>
        <hr style="margin:10px 0;">
        <div id="cart-items" style="max-height: 70vh; overflow-y:auto;"></div>
        <div style="position:absolute; bottom:20px; width:88%; border-top:1px solid #ddd; padding-top:10px;">
            <p style="font-weight:bold;">الإجمالي: <span id="total-price">0</span> ج.م</p>
            <button onclick="sendToWhatsApp()" style="width:100%; background:#25d366; color:white; border:none; padding:12px; margin-top:10px; border-radius:5px; font-weight:bold; cursor:pointer;">
                <i class="fab fa-whatsapp"></i> إرسال الطلب الآن
            </button>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleCart()"></div>

    <footer>
        <p style="font-size: 0.75rem;">© 2024 متجر مشالى للالكترونيات - جميع الحقوق محفوظة</p>
        <a href="login.html" class="admin-foot-link">دخول المدير</a>
    </footer>

    <script src="script.js"></script>
</body>
</html>
