<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشالى للالكترونيات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme">
    <header>
        <div class="header-top">
            <div style="display:flex; align-items:center; gap:8px;">
                <a href="index.html" class="logo" style="text-decoration:none; color:var(--primary); font-weight:900; font-size:1.2rem;">⚡ مشالى</a>
                <a href="academy.html" style="text-decoration:none; color:#e67e22; font-size:0.7rem; border:1px solid #e67e22; padding:2px 6px; border-radius:15px;">📺 التعليمية</a>
            </div>
            <div class="search-row">
                <div class="search-container">
                    <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="ابحث عن منتج...">
                    <i class="fas fa-search" style="position:absolute; right:10px; top:8px; color:#999;"></i>
                </div>
                <button onclick="toggleTheme()" class="qty-btn" style="background:#555; width:30px; height:30px;"><i class="fas fa-palette"></i></button>
            </div>
            <div onclick="toggleCart()" style="cursor:pointer; position:relative;">
                <i class="fas fa-shopping-basket"></i>
                <span id="cart-badge" style="position:absolute; top:-8px; right:-8px; background:red; color:white; border-radius:50%; padding:1px 5px; font-size:9px;">0</span>
            </div>
        </div>
    </header>

    <div class="news-ticker"><div class="ticker-content" id="ticker-text"></div></div>

    <main class="products-grid" id="products-grid"></main>

    <footer style="text-align:center; padding:20px 10px 60px;">
        <a href="manager.html" style="color:var(--text); text-decoration:none; font-size:0.8rem; border: 1px solid #ddd; padding: 5px 10px; border-radius: 5px;">⚙️ لوحة المدير</a>
    </footer>

    <div id="cart-sidebar" class="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h4>🛒 السلة</h4>
            <button onclick="clearFullCart()" style="background:none; border:none; color:red; font-size:0.7rem; cursor:pointer;">🗑️ مسح الكل</button>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:1.2rem; cursor:pointer;">✕</button>
        </div>
        <hr style="margin:10px 0; opacity:0.1;">
        <div id="cart-items"></div>
        <div style="position:absolute; bottom:15px; width:calc(100% - 30px);">
            <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px; font-size:0.9rem;">
                <span>الإجمالي:</span> <span id="total-price">0</span> ج.م
            </div>
            <button onclick="sendToWhatsApp()" style="width:100%; background:#25d366; color:white; border:none; padding:10px; border-radius:6px; font-weight:bold; cursor:pointer;">طلب واتساب</button>
        </div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleCart()"></div>
    <script src="script.js"></script>
</body>
</html>
