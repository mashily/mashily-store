<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مشالى | الإلكترونيات</title>
    <meta id="site-meta-description" name="description" content="متجر مشالى للإلكترونيات والفيديوهات التعليمية — تصفح الأصناف واطلب مباشرة عبر واتساب.">
    <link rel="canonical" href="https://mashily.github.io/mashily-store/">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:url" content="https://mashily.github.io/mashily-store/">
    <meta id="site-og-title" property="og:title" content="متجر مشالى | الإلكترونيات">
    <meta id="site-og-description" property="og:description" content="تصفح أصناف متجر مشالى واطلب مباشرة عبر واتساب.">
    <meta id="site-og-image" property="og:image" content="https://mashily.github.io/mashily-store/logo.png">
    <meta property="og:image:alt" content="متجر مشالى">
    <meta name="twitter:card" content="summary_large_image">
    <meta id="site-twitter-title" name="twitter:title" content="متجر مشالى | الإلكترونيات">
    <meta id="site-twitter-description" name="twitter:description" content="تصفح أصناف متجر مشالى واطلب مباشرة عبر واتساب.">
    <meta id="site-twitter-image" name="twitter:image" content="https://mashily.github.io/mashily-store/logo.png">
    <link rel="manifest" href="manifest.json">
    <meta id="site-theme-color" name="theme-color" content="#f7f9f8">
    <meta id="site-application-name" name="application-name" content="مشالى">
    <link id="site-favicon" rel="icon" type="image/png" href="logo.png">
    <link id="site-apple-touch-icon" rel="apple-touch-icon" href="icon-192.png">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .payment-options {
            display: flex;
            gap: 8px;
            justify-content: center;
        }
        .payment-option label {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 6px 4px;
            border: 2px solid #ddd;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            width: 55px;
            background: var(--bg);
        }
        .payment-option input[type="radio"] { display: none; }
        .payment-option input[type="radio"]:checked + label { border-color: var(--primary); background: #fff; box-shadow: 0 0 10px rgba(230, 126, 34, 0.3); }
        .payment-option i { font-size: 1.2rem; margin-bottom: 2px; color: var(--primary); }
        .payment-option span { font-size: 0.6rem; font-weight: bold; color: var(--text); }
        .payment-action label {
            border-color: #25d366;
            background: #f0fff4;
        }
        .payment-action label:hover {
            background: #d4edda;
        }
        .payment-action i {
            color: #25d366 !important;
        }
    </style>
</head>
<body>
    <header class="market-header">
        <div class="market-header-main">
            <a class="market-brand" href="index.html" aria-label="متجر مشالى">
                <img class="store-brand-logo" src="logo.png" alt="شعار متجر مشالى">
            </a>
            <a id="store-academy-link" class="market-academy-link" href="academy.html">
                <img id="store-academy-icon" class="academy-video-icon" src="video.png" alt="" aria-hidden="true">
                <span id="store-academy-name">أكاديمية مشالى للإلكترونيات</span>
            </a>
            <div class="market-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="search" id="search-input" oninput="searchProducts()" placeholder="ابحث باسم المنتج أو القسم أو المواصفات" autocomplete="off" aria-label="البحث في المنتجات">
                <button type="button" id="search-clear-btn" onclick="clearProductSearch()" aria-label="مسح البحث" hidden><i class="fas fa-times"></i></button>
                <label class="market-sort" for="product-sort">ترتيب
                    <select id="product-sort" onchange="sortProducts(this.value)" aria-label="ترتيب المنتجات">
                        <option value="default">افتراضي</option>
                        <option value="price_low">السعر: الأقل</option>
                        <option value="price_high">السعر: الأعلى</option>
                    </select>
                </label>
            </div>
            <div class="market-actions">
                <div class="market-theme-wrap">
                    <button class="market-icon-button" type="button" onclick="toggleThemeMenu(event)" aria-label="تغيير المظهر"><i id="theme-icon" class="fas fa-moon"></i></button>
                    <div id="theme-menu" class="market-theme-menu">
                        <button onclick="setTheme('dark', event)" title="داكن هادئ"><i class="fas fa-moon"></i></button>
                        <button onclick="setTheme('light', event)" title="فاتح"><i class="fas fa-sun"></i></button>
                        <button onclick="setTheme('white', event)" title="أبيض"><i class="fas fa-circle"></i></button>
                        <button onclick="setTheme('neon', event)" title="نيون"><i class="fas fa-bolt"></i></button>
                        <button onclick="setTheme('gold', event)" title="ذهبي"><i class="fas fa-crown"></i></button>
                        <button onclick="setTheme('ocean', event)" title="أزرق"><i class="fas fa-water"></i></button>
                        <button onclick="setTheme('rose', event)" title="وردي"><i class="fas fa-heart"></i></button>
                        <button onclick="setTheme('mint', event)" title="نعناعي"><i class="fas fa-leaf"></i></button>
                    </div>
                </div>
                <button class="market-icon-button market-badge-button" type="button" onclick="showWishlist()" aria-label="المفضلة">
                    <i class="fas fa-heart"></i><span id="wishlist-badge" class="market-badge" style="display:none;">0</span>
                </button>
                <button class="market-icon-button market-badge-button" type="button" onclick="toggleCart(true)" aria-label="سلة المشتريات">
                    <i class="fas fa-shopping-basket"></i><span id="cart-badge" class="market-badge">0</span>
                </button>
            </div>
        </div>
    </header>
    <nav class="market-category-bar" aria-label="أقسام المتجر">
        <div id="product-cats" aria-label="أقسام المنتجات"></div>
        <button id="site-tagline" class="market-admin-link" type="button" onclick="triggerAdmin()">للإلكترونيات والفيديوهات التعليمية</button>
    </nav>

    <section class="store-catalog" id="store-catalog" aria-labelledby="store-catalog-title">
        <div class="store-catalog-heading">
            <div>
                <h2 id="store-catalog-title">منتجات المتجر</h2>
            </div>
            <span id="store-results-count" class="store-results-count" role="status" aria-live="polite"></span>
        </div>
        <main class="products-grid" id="products-grid" aria-label="منتجات المتجر"></main>
    </section>

    <div class="news-ticker">
        <div class="ticker-content" id="ticker-text">🔥 أهلاً بكم في متجر مشالى للإلكترونيات - جودة نثق بها 🔥</div>
    </div>

    <div id="cart-sidebar" class="cart-sidebar" style="width: 350px; background: var(--card); display:flex; flex-direction:column;">
        <!-- رأس السلة -->
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px; background: var(--primary); color:white; border-radius: 8px 8px 0 0;">
            <h4 style="margin:0; font-size:1.2rem;">🛒 السلة</h4>
            <button onclick="toggleCart(false)" style="background:none; border:none; color:white; font-size:1.5rem; cursor:pointer; padding:0; width:30px; height:30px; display:flex; align-items:center; justify-content:center;">✕</button>
        </div>

        <!-- قائمة المنتجات - تأخذ كل المساحة المتاحة -->
        <div id="cart-items" style="flex:1; overflow-y:auto; padding:15px; border-bottom: 2px solid var(--primary);"></div>

        <!-- قسم الدفع والإجمالي -->
        <div class="cart-footer" style="background: var(--card); padding: 12px 15px; overflow-y:auto;">
            
            <!-- طريقة الدفع -->
            <div style="margin-bottom:10px;">
                <p style="margin:0 0 7px; font-size:.8rem; color:var(--text-light);">طريقة الدفع المفضلة</p>
                <div class="cart-payment-options">
                    <button class="cart-payment-option active" type="button" aria-pressed="true" onclick="togglePayment('cash', this)">
                        <i class="fas fa-money-bill" style="font-size:0.8rem;"></i> نقداً
                    </button>
                    <button class="cart-payment-option" type="button" aria-pressed="false" onclick="togglePayment('vodafone', this)">
                        <i class="fas fa-mobile-alt" style="font-size:0.8rem;"></i> فودافون
                    </button>
                    <button class="cart-payment-option" type="button" aria-pressed="false" onclick="togglePayment('instapay', this)">
                        <i class="fas fa-university" style="font-size:0.8rem;"></i> Instapay
                    </button>
                </div>
            </div>

            <!-- معلومات الدفع -->
            <div id="vodafone-info" style="display:none; background:#fff5f5; border:1px solid var(--primary); color:#c0392b; padding:8px; border-radius:6px; font-size:0.8rem; text-align:center; margin-bottom:10px;">
                <p style="margin:0 0 3px 0; font-weight:bold; font-size:0.75rem;">رقم فودافون:</p>
                <b id="vf-number-display" style="font-size:0.9rem; display:block; letter-spacing:1px;">01551831308</b>
            </div>
            <div id="instapay-info" style="display:none; background:#f3e5f5; border:1px solid var(--primary); color:#6a1b9a; padding:8px; border-radius:6px; font-size:0.8rem; text-align:center; margin-bottom:10px;">
                <p style="margin:0 0 3px 0; font-weight:bold; font-size:0.75rem;">حساب انستاباي:</p>
                <b id="ip-username-display" style="font-size:0.9rem; display:block; letter-spacing:1px;">Mashily@instapay</b>
                <div id="ip-qr-container" style="display:none; margin: 8px auto; width: fit-content;">
                    <img id="ip-qr-image" src="" alt="InstaPay QR" style="max-width: 80px; border-radius: 6px;">
                </div>
            </div>

            <!-- كوبون -->
            <div style="margin-bottom:12px;">
                <label style="display:block; font-size:0.85rem; margin-bottom:4px; color:var(--text);">كوبون:</label>
                <div style="display:flex; gap:4px;">
                    <input type="text" id="coupon-input" placeholder="الكود" style="flex:1; padding:6px; border:1px solid var(--border); border-radius:4px; background:var(--bg); color:var(--text); font-size:0.8rem;">
                    <button onclick="applyCoupon()" style="background:var(--primary); color:white; border:none; padding:6px 10px; border-radius:4px; cursor:pointer; font-weight:bold; font-size:0.75rem;">تطبيق</button>
                </div>
                <div id="coupon-msg" style="font-size:0.7rem; margin-top:3px; text-align:center; font-weight:bold; color:var(--primary);"></div>
            </div>

            <!-- الإجمالي -->
            <div id="cart-total-area" style="background:var(--bg); padding:8px; border-radius:6px; border:1px solid var(--border); margin-bottom:12px;">
                <div style="display:flex; justify-content:space-between; margin-bottom:2px; font-size:0.75rem;">
                    <span style="color:var(--text-light);">الفرعي:</span>
                    <span id="subtotal-price" style="color:var(--text); font-size:0.75rem;">0</span>
                </div>
                <div style="display:flex; justify-content:space-between; align-items:center; padding-top:6px; border-top:1px solid var(--border); font-weight:bold;">
                    <span style="color:var(--text); font-size:0.9rem;">الإجمالي:</span>
                    <div style="color:var(--primary); font-size:1rem; font-weight:900;">
                        <span id="total-price">0</span> <small style="font-size:0.6rem; color:var(--text-light);">ج.م</small>
                    </div>
                </div>
            </div>

            <button class="cart-checkout-btn" type="button" onclick="sendToWhatsApp()">
                <i class="fab fa-whatsapp"></i> تأكيد الطلب عبر واتساب
            </button>

            <!-- زر تفريغ السلة -->
            <button class="cart-clear-btn" type="button" onclick="clearCart()">
                <i class="fas fa-trash-alt"></i> إفراغ السلة
            </button>

</div>
    </div>
    <div id="overlay" class="overlay" onclick="if(event.target === this) { toggleCart(false); closeWishlist(); }"></div>

    <!-- Wishlist Sidebar -->
    <div id="wishlist-sidebar" class="cart-sidebar" style="right: auto; left: -350px; transition: left 0.3s ease;">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
            <h4>❤️ المفضلة</h4>
            <button onclick="closeWishlist()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; line-height:1;">✕</button>
        </div>
        <div id="wishlist-items" style="padding:10px; overflow-y:auto; height:calc(100% - 60px);"></div>
    </div>

    <!-- نافذة تفاصيل المنتج المنبثقة -->
    <div id="product-details-modal" onclick="if(event.target === this) closeProductModal()">
        <div class="details-content">
            <button onclick="closeProductModal()" class="close-modal-btn">✕</button>
            
            <div class="modal-body-grid">
                <!-- القسم الأيمن: معرض الصور -->
                <div class="modal-gallery-section">
                    <div class="gallery-container">
                        <button class="gallery-btn prev-btn" onclick="changeGalleryImage(-1)"><i class="fas fa-chevron-left"></i></button>
                        <img id="modal-img" class="gallery-img" src="" alt="Product">
                        <div id="modal-video" style="display:none; width:100%; height:100%; align-items:center; justify-content:center;"></div>
                        <button class="gallery-btn next-btn" onclick="changeGalleryImage(1)"><i class="fas fa-chevron-right"></i></button>
                        <button class="gallery-btn fullscreen-btn" onclick="toggleFullscreen()" title="تكبير الشاشة"><i class="fas fa-expand"></i></button>
                    </div>
                    <div id="modal-dots" class="gallery-dots"></div>
                    <div id="modal-thumbnails" class="gallery-thumbnails"></div>
                </div>

                <!-- القسم الأيسر: البيانات -->
                <div class="modal-info-section">
                    <h2 id="modal-title"></h2>
                    <div id="modal-meta" style="display:flex; gap:8px; align-items:center; flex-wrap:wrap;"></div>
                    
                    <div id="modal-price-area"></div>
                    
                    <p id="modal-desc"></p>
                    
                    <div style="margin-top: 10px;">
                        <h4 style="margin: 0 0 8px 0; color: var(--text);">📋 المواصفات:</h4>
                        <div id="modal-specs"></div>
                    </div>
                    
                    <div style="display: flex; gap: 10px; margin-top: auto; padding-top: 20px;">
                        <button id="modal-add-btn" class="btn" style="flex: 2; font-size: 1.1rem; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
                            <i class="fas fa-cart-plus"></i> إضافة للسلة
                        </button>
                        <button id="modal-wishlist-btn" class="btn" style="flex: 0.6; background: var(--bg); color: var(--text); border: 1px solid var(--border); font-size: 1.3rem; padding: 12px; display: flex; align-items: center; justify-content: center;">
                            <i class="far fa-heart"></i>
                        </button>
                        <button id="modal-share-btn" class="btn" style="flex: 1; background: #25d366; color: white; font-size: 1.1rem; padding: 12px; display: flex; align-items: center; justify-content: center; gap: 10px;">
                            <i class="fab fa-whatsapp"></i> مشاركة
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="xlsx.full.min.js"></script>
    <script src="excel-loader.js"></script>
    <script src="script.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js').catch(function(err) {
                    console.log('SW registration failed:', err);
                });
            });
        }
    </script>
    <script>
        // زر تثبيت التطبيق (PWA)
        let deferredPrompt = null;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('install-btn');
            if (btn) btn.style.display = 'flex';
        });
        window.addEventListener('appinstalled', () => {
            const btn = document.getElementById('install-btn');
            if (btn) btn.style.display = 'none';
        });
        document.addEventListener('DOMContentLoaded', () => {
            const btn = document.getElementById('install-btn');
            if (!btn) return;
            const isInstalled = window.matchMedia('(display-mode: standalone)').matches
                || window.navigator.standalone === true;
            if (isInstalled) {
                btn.style.display = 'none';
                return;
            }

            btn.style.display = 'flex';
            btn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    deferredPrompt.prompt();
                    const choice = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                    if (choice && choice.outcome === 'accepted') btn.style.display = 'none';
                    return;
                }

                const isAppleMobile = /iPhone|iPad|iPod/i.test(navigator.userAgent)
                    || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
                if (isAppleMobile) {
                    alert('لتثبيت التطبيق على iPhone أو iPad:\\n1. افتح الموقع في Safari.\\n2. اضغط زر المشاركة.\\n3. اختر «إضافة إلى الشاشة الرئيسية».');
                } else {
                    alert('لتثبيت التطبيق، افتح الموقع في Chrome أو Edge، ثم اختر «تثبيت التطبيق» أو «إضافة إلى الشاشة الرئيسية» من قائمة المتصفح.');
                }
            });
        });
    </script>
    <button id="install-btn" style="display:none; position:fixed; bottom:20px; left:20px; background:#2e8b57; color:white; border:none; padding:12px 18px; border-radius:50px; cursor:pointer; font-weight:bold; font-size:0.9rem; box-shadow:0 4px 15px rgba(0,0,0,0.25); z-index:3000; align-items:center; gap:8px;">
        <i class="fas fa-download"></i> تثبيت التطبيق
    </button>
    <a id="wa-float-btn" href="https://wa.me/201551831308?text=%D8%A3%D8%B1%D9%8A%D8%AF%20%D8%AA%D8%B5%D9%81%D8%AD%20%D8%A7%D9%84%D9%85%D8%AA%D8%AC%D8%B1%3A%20https%3A%2F%2Fmashily.github.io%2Fmashily-store%2F" class="whatsapp-float" target="_blank">
        <i class="fab fa-whatsapp"></i>
    </a>
</body>
</html>
