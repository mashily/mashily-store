<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشالى للالكترونيات | الرئيسية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="light-theme">

    <header>
        <div class="header-top">
            <div style="display:flex; align-items:center; gap:10px;">
                <a href="index.html" class="logo" style="text-decoration:none; color:var(--primary); font-weight:900; font-size:1.4rem;">⚡ مشالى</a>
                <a href="academy.html" style="text-decoration:none; color:#e67e22; font-weight:bold; font-size:0.8rem; border:1px solid #e67e22; padding:3px 8px; border-radius:20px;"><i class="fas fa-play-circle"></i> مشالى التعليمية</a>
            </div>
            
            <div class="search-row">
                <div class="search-container">
                    <input type="text" id="search-input" onkeyup="searchProducts()" placeholder="ابحث عن منتج...">
                    <i class="fas fa-search" style="position:absolute; right:10px; top:10px; color:#999;"></i>
                </div>
                <button onclick="toggleTheme()" class="qty-btn" style="background:#444; width:35px; height:35px;"><i class="fas fa-palette"></i></button>
            </div>

            <div onclick="toggleCart()" style="cursor:pointer; position:relative;">
                <i class="fas fa-shopping-basket fa-lg"></i>
                <span id="cart-badge" style="position:absolute; top:-10px; right:-10px; background:red; color:white; border-radius:50%; padding:2px 6px; font-size:10px; font-weight:bold;">0</span>
            </div>
        </div>
        <nav style="margin-top:10px; display:flex; gap:8px; overflow-x:auto; padding-bottom:5px;">
            <button onclick="filterProducts('الكل')" class="qty-btn" style="background:var(--primary);">الكل</button>
            <button onclick="showOffers()" class="qty-btn" style="background:#ff4757;">🔥 عروض</button>
            <div id="categories-nav" style="display:flex; gap:8px;"></div>
        </nav>
    </header>

    <div class="news-ticker"><div class="ticker-content" id="ticker-text"></div></div>

    <main class="products-grid" id="products-grid"></main>

    <footer style="text-align:center; padding:30px 10px 80px 10px;">
        <p style="opacity:0.5; font-size:0.8rem;">جميع الحقوق محفوظة لمشالى للالكترونيات © 2024</p>
        <a href="login.html" style="color:var(--text); text-decoration:none; font-size:0.8rem; border-bottom:1px solid #999;"><i class="fas fa-user-shield"></i> لوحة المدير</a>
    </footer>

    <div id="cart-sidebar" class="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h3>🛒 سلة المشتريات</h3>
            <button onclick="toggleCart()" style="background:none; border:none; font-size:1.5rem; cursor:pointer; color:var(--text);">✕</button>
        </div>
        <hr style="margin:15px 0; opacity:0.1;">
        <div id="cart-items" style="max-height:60vh; overflow-y:auto;"></div>
        <div style="position:absolute; bottom:20px; width:calc(100% - 40px);">
            <h4 style="display:flex; justify-content:space-between; margin-bottom:10px;"><span>الإجمالي:</span> <span id="total-price">0</span> ج.م</h4>
            <button onclick="sendToWhatsApp()" style="width:100%; background:#25d366; color:white; border:none; padding:12px; border-radius:8px; font-weight:bold; cursor:pointer;">إرسال الطلب واتساب</button>
        </div>
    </div>

    <div id="overlay" class="overlay" onclick="toggleCart()"></div>

    <script src="script.js"></script>
</body>
</html>
