<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر مشالى | الإلكترونيات</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="header-top">
            <a href="index.html" class="logo">⚡ مشالى</a>
            <div style="flex:1; max-width:300px;"><input type="text" id="search-input" onkeyup="searchProducts()" placeholder="ابحث عن رسيفر، وصلة..."></div>
            <div style="display:flex; align-items:center; gap:12px;">
                <a href="manager.html" style="color:var(--text); font-size:1.1rem;"><i class="fas fa-user-shield"></i></a>
                <div onclick="toggleDarkMode()" style="cursor:pointer; color:var(--text); font-size:1.1rem;"><i id="theme-icon" class="fas fa-moon"></i></div>
                <div onclick="toggleCart(true)" style="position:relative; cursor:pointer; color:var(--text); font-size:1.1rem;">
                    <i class="fas fa-shopping-basket"></i>
                    <span id="cart-badge" class="badge">0</span>
                </div>
            </div>
        </div>
        <div style="text-align:center; padding:10px; background:#fcfcfc;" id="sub-nav">
            <a href="academy.html" class="academy-link">📺 الأكاديمية التعليمية (شروحات)</a>
        </div>
    </header>

    <div class="cat-nav-scroll" id="product-cats"></div>

    <div class="news-ticker">
        <div class="ticker-content" id="ticker-text">🔥 أهلاً بكم في متجر مشالى للإلكترونيات - جودة نثق بها 🔥</div>
    </div>

    <main class="products-grid" id="products-grid"></main>

    <div id="cart-sidebar" class="cart-sidebar">
        <div style="display:flex; justify-content:space-between; align-items:center; padding:15px;">
            <h4>🛒 سلة مشترياتك</h4>
            <button onclick="toggleCart(false)" style="background:none; border:none; font-size:1.5rem;">✕</button>
        </div>
        <div id="cart-items" style="padding:10px; overflow-y:auto; height:calc(100% - 200px);"></div>
       <div class="cart-footer">
    <div style="display:flex; justify-content:space-between; font-weight:bold; margin-bottom:10px;">
        <span>الإجمالي:</span>
        <span id="total-price">0</span> ج.م
    </div>
    <button onclick="sendToWhatsApp()" class="order-btn" style="display:flex; align-items:center; justify-content:center; gap:10px;">
        <i class="fab fa-whatsapp" style="font-size:1.3rem;"></i> 
        إتمام الطلب عبر واتساب
    </button>
</div>
    </div>
    <div id="overlay" class="overlay" onclick="toggleCart(false)"></div>

    <script src="script.js"></script>
    <a href="https://wa.me/201551831308" class="whatsapp-float" target="_blank">
    <i class="fab fa-whatsapp"></i>
</a>
</body>
</html>
