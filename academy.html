<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية مشالى | شروحات تقنية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body style="background:#f8f9fa;">
    <header style="background:#fff; border-bottom:2px solid #e67e22; padding:15px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html" style="text-decoration:none; color:#333;"><i class="fas fa-arrow-right"></i> المتجر</a>
            <h3 style="color:#e67e22; margin:0;">📺 أكاديمية مشالى</h3>
            <div style="width:40px;"></div>
        </div>
    </header>

    <div style="padding:15px;">
        <input type="text" id="v-search" onkeyup="renderAcademy()" placeholder="ابحث في الدروس..." style="width:100%; padding:12px; border-radius:25px; border:1px solid #ddd; outline:none;">
    </div>

    <main class="products-grid" id="v-grid" style="padding:15px;"></main>

    <script>
        function renderAcademy() {
            const grid = document.getElementById('v-grid');
            const vids = JSON.parse(localStorage.getItem('academyVideos')) || [];
            const likes = JSON.parse(localStorage.getItem('videoLikes')) || {};
            const term = document.getElementById('v-search').value.toLowerCase();

            let filtered = vids.filter(v => v.title.toLowerCase().includes(term));

            grid.innerHTML = filtered.map(v => {
                let vId = v.url.split('v=')[1] || v.url.split('/').pop();
                return `
                <div class="product-card" style="padding:0; overflow:hidden; background:white; border-radius:15px; box-shadow:0 4px 10px rgba(0,0,0,0.05);">
                    <iframe width="100%" height="180" src="https://www.youtube.com/embed/${vId}" frameborder="0" allowfullscreen></iframe>
                    <div style="padding:15px;">
                        <h4 style="font-size:0.9rem; margin-bottom:12px;">${v.title}</h4>
                        
                        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:8px; margin-bottom:12px;">
                            ${v.fileUrl ? `<a href="${v.fileUrl}" target="_blank" style="text-decoration:none; background:#27ae60; color:white; padding:6px; border-radius:8px; font-size:0.7rem; text-align:center;"><i class="fas fa-file-download"></i> ملف الشرح</a>` : ''}
                            <a href="https://ssyoutube.com/en1/youtube-video-downloader?url=${v.url}" target="_blank" style="text-decoration:none; background:#c0392b; color:white; padding:6px; border-radius:8px; font-size:0.7rem; text-align:center;"><i class="fas fa-video"></i> تحميل الفيديو</a>
                        </div>

                        <div style="display:flex; justify-content:space-between; align-items:center;">
                            <button onclick="likeV(${v.id})" style="background:none; border:1px solid #eee; padding:5px 12px; border-radius:10px; cursor:pointer;">
                                👍 <span id="l-${v.id}">${likes[v.id]||0}</span>
                            </button>
                            <span style="color:#e67e22; font-size:0.75rem; font-weight:bold;">#${v.category}</span>
                        </div>
                    </div>
                </div>
            `}).join('');
        }

        function likeV(id){
            let l = JSON.parse(localStorage.getItem('videoLikes')) || {};
            l[id] = (l[id]||0)+1;
            localStorage.setItem('videoLikes', JSON.stringify(l));
            document.getElementById('l-'+id).innerText = l[id];
        }
        window.onload = renderAcademy;
    </script>
</body>
</html>
