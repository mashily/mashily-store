<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="academy-meta-description" name="description" content="أكاديمية مشالى التعليمية - منصتك الأولى لتعلم صيانة الإلكترونيات، البرمجة، وأحدث التقنيات. دروس حصرية ومجانية.">
    <meta name="keywords" content="صيانة, إلكترونيات, برمجة, تعليم, دورات, مشالى, أكاديمية">
    <meta name="author" content="Mashily Store">
    <link rel="canonical" href="https://mashily.github.io/mashily-store/academy.html">
    <link rel="manifest" href="manifest.json">
    <meta id="academy-theme-color" name="theme-color" content="#f7f9f8">
    <meta id="academy-application-name" name="application-name" content="مشالى">
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="apple-touch-icon" href="logo.png">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:url" content="https://mashily.github.io/mashily-store/academy.html">
    <meta id="academy-og-title" property="og:title" content="أكاديمية مشالى | تعلم واحترف">
    <meta id="academy-og-description" property="og:description" content="أكاديمية مشالى التعليمية - دروس صيانة الإلكترونيات والبرمجة.">
    <meta property="og:image" content="https://mashily.github.io/mashily-store/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>أكاديمية مشالى | تعلم واحترف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- الهيدر -->
    <header class="market-header">
        <div class="market-header-main">
            <a class="market-brand" href="index.html" aria-label="متجر مشالى">
                <img src="logo.png" alt="شعار متجر مشالى">
            </a>
            <a class="market-academy-link" href="#academy-library" aria-label="أكاديمية مشالى التعليمية">
                <img class="academy-video-icon" src="academy-video-icon.svg" alt="" aria-hidden="true">
                <span id="academy-header-name">أكاديمية مشالى التعليمية</span>
            </a>
            <label class="market-search" for="academy-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="search" id="academy-search" placeholder="ابحث باسم الدرس أو القسم..." oninput="searchAcademy()" aria-label="البحث في الدروس">
            </label>
            <button id="site-tagline" class="market-admin-link" type="button" onclick="triggerAdmin()">للإلكترونيات والفيديوهات التعليمية</button>
            <div class="market-actions">
                <div class="market-theme-wrap">
                    <button class="market-icon-button" type="button" onclick="toggleThemeMenu(event)" aria-label="تغيير المظهر"><i id="theme-icon" class="fas fa-moon"></i></button>
                    <div id="theme-menu" class="market-theme-menu">
                        <button onclick="setTheme('dark', event)" title="داكن هادئ"><i class="fas fa-moon"></i></button>
                        <button onclick="setTheme('light', event)" title="فاتح"><i class="fas fa-sun"></i></button>
                        <button onclick="setTheme('neon', event)" title="نيون"><i class="fas fa-bolt"></i></button>
                        <button onclick="setTheme('gold', event)" title="ذهبي"><i class="fas fa-crown"></i></button>
                    </div>
                </div>
                <button class="market-icon-button" type="button" onclick="document.getElementById('academy-library-filter').value='favorites'; applyAcademyFilters();" aria-label="دروس المفضلة">
                    <i class="fas fa-heart"></i>
                </button>
                <a class="market-icon-button" href="index.html" aria-label="العودة إلى المتجر"><i class="fas fa-shopping-basket"></i></a>
            </div>
        </div>
        <nav class="market-category-bar" aria-label="أقسام الأكاديمية">
            <div id="academy-cats" class="cat-nav-scroll"></div>
        </nav>
    </header>

    <!-- القسم الترحيبي (Hero Section) -->
    <div class="academy-hero">
        <div class="hero-content">
        <h1 class="academy-brand-mark"><img id="academy-page-icon" src="academy-video-icon.svg" alt="" aria-hidden="true"><span id="academy-page-name">أكاديمية مشالى التعليمية</span></h1>
        <p id="academy-page-description">تعلّم خطوة بخطوة عبر دروس مصوّرة، وابحث عن الموضوع الذي تحتاجه أو تابع من حيث توقفت.</p>
        <div class="hero-stats">
            <span id="academy-video-count"><i class="fas fa-video"></i> جاري تحميل الدروس</span>
            <span id="academy-category-count"><i class="fas fa-layer-group"></i> جاري تحميل الأقسام</span>
        </div>
        <a class="academy-hero-action" href="#academy-library" aria-controls="academy-grid"><i class="fas fa-play"></i> اكتشف الدروس</a>
    </div>
    </div>

    <!-- أدوات البحث والفلترة -->
    <section class="academy-library" id="academy-library" aria-labelledby="academy-library-title">
    <div class="academy-controls">
        <!-- قائمة الترتيب -->
        <div class="academy-sort-container">
            <select id="academy-sort" onchange="sortAcademyVideos()" aria-label="ترتيب الدروس">
                <option value="newest">📅 الأحدث أولاً</option>
                <option value="oldest">📅 الأقدم أولاً</option>
                <option value="most_viewed">🔥 الأكثر مشاهدة</option>
                <option value="most_liked">👍 الأكثر إعجاباً</option>
            </select>
            <select id="academy-library-filter" onchange="applyAcademyFilters()" aria-label="تصفية فيديوهات الأكاديمية">
                <option value="all">كل الفيديوهات</option>
                <option value="favorites">❤️ المفضلة</option>
                <option value="continue">▶️ أكمل المشاهدة</option>
                <option value="completed">✅ تمت مشاهدتها</option>
            </select>
        </div>

    </div>

    <!-- شبكة الفيديوهات -->
    <div class="academy-library-heading">
        <h2 id="academy-library-title">مكتبة الدروس</h2>
        <span id="academy-results-count" role="status" aria-live="polite"></span>
    </div>
    <main class="video-grid" id="academy-grid" aria-label="دروس الأكاديمية">
        <!-- سيتم عرض الفيديوهات هنا -->
        <div class="loader" style="grid-column: 1/-1; margin: 50px auto;"></div>
    </main>
    </section>

    <!-- مشغل الفيديو المنبثق -->
    <div id="video-player-modal" class="video-modal-overlay" onclick="if(event.target === this) closeVideoModal()">
        <div class="video-modal-content">
            <button class="close-video-btn" onclick="closeVideoModal()">✕</button>
            <div id="video-frame-container" class="video-frame-container">
                <button id="academy-fullscreen-btn" class="academy-fullscreen-btn" type="button" onclick="toggleAcademyVideoFullscreen()" aria-label="تكبير الفيديو" title="تكبير الفيديو">
                    <i class="fas fa-expand" aria-hidden="true"></i>
                </button>
                <!-- سيتم وضع الفيديو هنا -->
            </div>
            <div id="academy-player-notice" class="academy-player-notice" role="status" aria-live="polite" hidden></div>
            <div id="video-progress-container" class="video-progress-container">
                <div id="video-progress-bar" class="video-progress-bar"></div>
            </div>
            <div id="video-attachments-container" class="video-attachments"></div>
            
            <!-- قسم التفاعلات (لايك وتعليقات) -->
            <div class="video-interactions">
                <!-- شريط تقدم المستخدم -->
                <div class="user-profile-bar">
                    <div class="user-info">
                        <i class="fas fa-user-astronaut"></i>
                        <span id="profile-username">زائر</span>
                        <button id="edit-username-btn" onclick="changeUsername()" title="تغيير اسمك"><i class="fas fa-pencil-alt"></i></button>
                    </div>
                    <div class="level-info">
                        <span id="profile-level" class="level-badge">مبتدئ</span>
                        <div class="progress-container">
                            <div id="profile-progress" class="progress-bar"></div>
                        </div>
                        <span id="profile-points">0 / 100 نقطة</span>
                    </div>
                </div>
                <div class="video-actions">
                    <button id="video-like-btn" class="action-btn" onclick="toggleVideoLike()">
                        <i class="far fa-thumbs-up"></i> <span id="video-like-count">0</span> أعجبني
                    </button>
                    <button id="video-dislike-btn" class="action-btn" onclick="toggleVideoDislike()">
                        <i class="far fa-thumbs-down"></i> <span id="video-dislike-count">0</span> لم يعجبني
                    </button>
                    <button id="video-share-btn" class="action-btn" onclick="shareAcademyVideo()">
                        <i class="fas fa-share"></i> مشاركة
                    </button>
                </div>
                <div class="comments-section">
                    <h3 style="color:white; font-size:1rem; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">التعليقات</h3>
                    <div class="comment-form">
                        <input type="text" id="comment-input" placeholder="أضف تعليقاً..." onkeypress="if(event.key==='Enter') submitComment()">
                        <button onclick="submitComment()" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div id="comments-list" class="comments-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer style="text-align: center; padding: 20px; color: var(--text-light); margin-top: 50px; border-top: 1px solid var(--border);">
        <p id="academy-footer-text">© 2026 أكاديمية مشالى - جميع الحقوق محفوظة</p>
    </footer>

    <script src="xlsx.full.min.js"></script>
    <script src="excel-loader.js"></script>
    <script src="script.js"></script>
    <script>
        window.addEventListener('load', async () => {
            await init();
            initAcademyPage();
        });
    </script>
</body>
</html>
