<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta id="academy-meta-description" name="description" content="أكاديمية مشالى التعليمية - منصتك الأولى لتعلم صيانة الإلكترونيات، البرمجة، وأحدث التقنيات. دروس حصرية ومجانية.">
    <meta name="keywords" content="صيانة, إلكترونيات, برمجة, تعليم, دورات, مشالى, أكاديمية">
    <meta name="author" content="Mashily Store">
    <link rel="canonical" href="https://mashily.github.io/mashily-store/academy.html">
    <link rel="manifest" href="manifest.json">
    <meta id="academy-theme-color" name="theme-color" content="#f7f9f8">
    <meta id="academy-application-name" name="application-name" content="مشالى">
    <link id="academy-favicon" rel="icon" type="image/png" href="logo.png">
    <link id="academy-apple-touch-icon" rel="apple-touch-icon" href="logo.png">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="ar_AR">
    <meta property="og:url" content="https://mashily.github.io/mashily-store/academy.html">
    <meta id="academy-og-title" property="og:title" content="أكاديمية مشالى | تعلم واحترف">
    <meta id="academy-og-description" property="og:description" content="أكاديمية مشالى التعليمية - دروس صيانة الإلكترونيات والبرمجة.">
    <meta id="academy-og-image" property="og:image" content="https://mashily.github.io/mashily-store/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <title>أكاديمية مشالى | تعلم واحترف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div id="app-splash" class="app-splash" role="status" aria-live="polite">
        <img id="app-splash-image" src="logo.png" alt="شعار متجر مشالى">
        <span id="app-splash-text">جاري تحميل الأكاديمية...</span>
    </div>
    <!-- الهيدر -->
    <header class="market-header">
        <div class="market-header-main">
            <div class="academy-mode-switch" aria-label="اختيار القسم الرئيسي">
                <a class="academy-mode-button" href="index.html" onclick="animateStoreModeSwitch(event, this)">
                    <i class="fas fa-store" aria-hidden="true"></i>
                    <span id="mode-store-label">المتجر</span>
                </a>
                <a class="academy-mode-button active" href="academy.html" aria-current="page" onclick="animateStoreModeSwitch(event, this)">
                    <i class="fab fa-youtube" aria-hidden="true"></i>
                    <span id="mode-academy-label">الفيديوهات التعليمية</span>
                </a>
            </div>
            <label class="market-search" for="academy-search">
                <i class="fas fa-search" aria-hidden="true"></i>
                <input type="search" id="academy-search" placeholder="ابحث باسم الدرس أو القسم..." oninput="searchAcademy()" aria-label="البحث في الدروس" autocomplete="off">
            </label>
            <div class="market-actions">
                <div class="market-theme-wrap">
                    <button class="market-icon-button" type="button" onclick="toggleThemeMenu(event)" aria-label="تغيير المظهر"><i id="theme-icon" class="fas fa-moon"></i></button>
                    <div id="theme-menu" class="market-theme-menu">
                        <button data-theme-choice="dark" onclick="setTheme('dark', event)" title="داكن هادئ"><i class="fas fa-moon"></i></button>
                        <button data-theme-choice="light" onclick="setTheme('light', event)" title="فاتح"><i class="fas fa-sun"></i></button>
                        <button data-theme-choice="white" onclick="setTheme('white', event)" title="أبيض"><i class="fas fa-circle"></i></button>
                        <button data-theme-choice="neon" onclick="setTheme('neon', event)" title="نيون"><i class="fas fa-bolt"></i></button>
                        <button data-theme-choice="gold" onclick="setTheme('gold', event)" title="ذهبي"><i class="fas fa-crown"></i></button>
                        <button data-theme-choice="ocean" onclick="setTheme('ocean', event)" title="أزرق"><i class="fas fa-water"></i></button>
                        <button data-theme-choice="rose" onclick="setTheme('rose', event)" title="وردي"><i class="fas fa-heart"></i></button>
                        <button data-theme-choice="mint" onclick="setTheme('mint', event)" title="نعناعي"><i class="fas fa-leaf"></i></button>
                    </div>
                </div>
                <a class="market-icon-button" href="index.html" aria-label="العودة إلى المتجر"><i class="fas fa-shopping-basket"></i></a>
            </div>
        </div>
        <div class="academy-controls">
            <div class="academy-sort-container">
                <select id="academy-sort" onchange="sortAcademyVideos()" aria-label="ترتيب الدروس">
                    <option value="newest">الأحدث أولاً</option>
                    <option value="oldest">الأقدم أولاً</option>
                    <option value="most_viewed">الأكثر مشاهدة</option>
                    <option value="most_liked">الأكثر إعجاباً</option>
                </select>
                <select id="academy-library-filter" onchange="applyAcademyFilters()" aria-label="تصفية فيديوهات الأكاديمية">
                    <option value="all">كل الفيديوهات</option>
                    <option value="favorites">المفضلة</option>
                    <option value="continue">أكمل المشاهدة</option>
                    <option value="completed">تمت مشاهدتها</option>
                </select>
            </div>
        </div>
    </header>
    <nav class="market-category-bar" aria-label="أقسام الأكاديمية">
        <div id="academy-cats" class="cat-nav-scroll"></div>
    </nav>

    <!-- مقدمة الأكاديمية: الاسم والوصف والشعار تُقرأ من ورقة Settings -->
    <section id="academy-hero" class="academy-hero" aria-labelledby="academy-page-name">
        <div class="academy-brand-mark">
            <img id="academy-page-icon" class="academy-video-icon" src="video.png" alt="شعار الأكاديمية" width="56" height="56" decoding="async">
            <span id="academy-header-name"></span>
        </div>
        <h1 id="academy-page-name">الفيديوهات التعليمية</h1>
        <p id="academy-page-description">منصتك الأولى لتعلم صيانة الإلكترونيات والبرمجة وأحدث التقنيات.</p>
        <a class="academy-hero-action" href="index.html">
            <i class="fas fa-store" aria-hidden="true"></i>
            <span id="academy-store-name">متجر مشالى</span>
        </a>
    </section>

    <section class="academy-library" id="academy-library" aria-labelledby="academy-library-title">
        <h2 id="academy-library-title" class="visually-hidden">دروس الأكاديمية</h2>
        <span id="academy-results-count" class="academy-results-count" role="status" aria-live="polite"></span>
        <main class="video-grid" id="academy-grid" aria-label="دروس الأكاديمية">
            <div class="loader" style="grid-column: 1/-1; margin: 50px auto;"></div>
        </main>
    </section>

    <!-- مشغل الفيديو المنبثق -->
    <div id="video-player-modal" class="video-modal-overlay" onclick="if(event.target === this) closeVideoModal()">
        <div class="video-modal-content">
            <button class="close-video-btn" onclick="closeVideoModal()">✕</button>
            <div id="video-frame-container" class="video-frame-container">
                <button id="academy-fullscreen-btn" class="academy-fullscreen-btn" type="button" onclick="toggleAcademyVideoFullscreen()" aria-label="تكبير الفيديو" title="تكبير الفيديو">
                    <i class="fas fa-expand" aria-hidden="true"></i>
                </button>
                <!-- سيتم وضع الفيديو هنا -->
            </div>
            <div id="academy-player-notice" class="academy-player-notice" role="status" aria-live="polite" hidden></div>
            <div id="video-progress-container" class="video-progress-container">
                <div id="video-progress-bar" class="video-progress-bar"></div>
            </div>
            <div id="video-attachments-container" class="video-attachments"></div>
            <section id="academy-video-tools" class="academy-video-tools" aria-labelledby="academy-video-tools-title" hidden>
                <div class="academy-video-tools-heading">
                    <div>
                        <span>الأدوات والقطع المستخدمة</span>
                        <h3 id="academy-video-tools-title">منتجات مرتبطة بالفيديو</h3>
                    </div>
                </div>
                <p id="academy-video-tools-list" class="academy-video-tools-list"></p>
                <div id="academy-linked-products" class="academy-linked-products"></div>
            </section>
            
            <!-- قسم التفاعلات (لايك وتعليقات) -->
            <div class="video-interactions">
                <!-- شريط تقدم المستخدم -->
                <div class="user-profile-bar">
                    <div class="user-info">
                        <i class="fas fa-user-astronaut"></i>
                        <span id="profile-username">زائر</span>
                        <button id="edit-username-btn" onclick="changeUsername()" title="تغيير اسمك"><i class="fas fa-pencil-alt"></i></button>
                    </div>
                    <div class="level-info">
                        <span id="profile-level" class="level-badge">مبتدئ</span>
                        <div class="progress-container">
                            <div id="profile-progress" class="progress-bar"></div>
                        </div>
                        <span id="profile-points">0 / 100 نقطة</span>
                    </div>
                </div>
                <div class="video-actions">
                    <button id="video-like-btn" class="action-btn" onclick="toggleVideoLike()">
                        <i class="far fa-thumbs-up"></i> <span id="video-like-count">0</span> أعجبني
                    </button>
                    <button id="video-dislike-btn" class="action-btn" onclick="toggleVideoDislike()">
                        <i class="far fa-thumbs-down"></i> <span id="video-dislike-count">0</span> لم يعجبني
                    </button>
                    <button id="video-share-btn" class="action-btn" onclick="shareAcademyVideo()">
                        <i class="fas fa-share"></i> مشاركة
                    </button>
                </div>
                <div class="comments-section">
                    <h3 style="color:white; font-size:1rem; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">التعليقات</h3>
                    <div class="comment-form">
                        <input type="text" id="comment-input" placeholder="أضف تعليقاً..." onkeypress="if(event.key==='Enter') submitComment()">
                        <button onclick="submitComment()" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div id="comments-list" class="comments-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer style="text-align: center; padding: 20px; color: var(--text-light); margin-top: 50px; border-top: 1px solid var(--border);">
        <p id="academy-footer-text">© 2026 أكاديمية مشالى - جميع الحقوق محفوظة</p>
    </footer>

    <nav id="academy-mobile-bottom-nav" class="mobile-bottom-nav" aria-label="تنقل المتجر">
        <button class="mobile-nav-item" type="button" onclick="window.location.href='index.html#offers'" aria-label="التخفيضات والعروض الخاصة">
            <i class="fas fa-fire" aria-hidden="true"></i><span id="academy-mobile-offers-label">التخفيضات</span>
        </button>
        <button class="mobile-nav-item" type="button" onclick="window.location.href='cart.html'" aria-label="سلة المشتريات">
            <i class="fas fa-shopping-basket" aria-hidden="true"></i><span id="academy-mobile-cart-label">السلة</span>
        </button>
        <button class="mobile-nav-store" type="button" onclick="window.location.href='index.html'" aria-label="الرئيسية: عرض كل المنتجات">
            <span class="mobile-nav-store-ring"><img id="academy-mobile-store-logo" class="store-brand-logo" src="logo.png" alt="متجر مشالى"></span>
            <span id="academy-mobile-store-label">الرئيسية</span>
        </button>
        <button id="academy-mobile-nav-maintenance" class="mobile-nav-item" type="button" onclick="window.location.href='index.html#maintenance'" aria-label="طلب صيانة">
            <i class="fas fa-screwdriver-wrench" aria-hidden="true"></i><span id="academy-mobile-maintenance-label">الصيانة</span>
        </button>
        <button class="mobile-nav-item active" type="button" aria-current="page" aria-label="الفيديوهات التعليمية" onclick="window.scrollTo({top: 0, behavior: 'smooth'})">
            <i class="fas fa-play-circle" aria-hidden="true"></i><span id="academy-mobile-videos-label">الفيديوهات</span>
        </button>
    </nav>

    <script src="xlsx.full.min.js"></script>
    <script src="excel-loader.js"></script>
    <script src="script.js"></script>
    <script>
        window.addEventListener('load', async () => {
            await init();
            initAcademyPage();
            hideAppSplash();
        });
    </script>
</body>
</html>
