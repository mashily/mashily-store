<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مشالى التعليمية</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="light-theme">
    <header><div class="header-top"><a href="index.html" style="text-decoration:none; color:var(--text);">🔙 المتجر</a><h3>📺 مشالى التعليمية</h3></div></header>
    <div id="v-cats" style="padding:10px; display:flex; gap:8px; overflow-x:auto;"></div>
    <main class="products-grid" id="academy-grid" style="grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));"></main>
    <script src="script.js"></script>
    <script>
        function renderAcademy(f = 'الكل') {
            const vids = JSON.parse(localStorage.getItem('academyVideos')) || [];
            const cats = ['الكل', ...new Set(vids.map(v => v.category))];
            document.getElementById('v-cats').innerHTML = cats.map(c => `<button class="qty-btn" style="background:#666;" onclick="renderAcademy('${c}')">${c}</button>`).join('');
            const filtered = f === 'الكل' ? vids : vids.filter(v => v.category === f);
            document.getElementById('academy-grid').innerHTML = filtered.map(v => `
                <div class="product-card" style="text-align:right;">
                    <iframe width="100%" height="150" src="https://www.youtube.com/embed/${v.url.split('v=')[1] || v.url.split('/').pop()}" frameborder="0" allowfullscreen></iframe>
                    <h5 style="margin:8px 0;">${v.title}</h5>
                    <button class="qty-btn" style="width:100%; background:#25d366; font-size:0.7rem;" onclick="window.open('https://wa.me/201551831308?text=استفسار:${v.title}')">استفسار واتساب</button>
                </div>
            `).join('');
        }
        window.onload = () => { applyTheme(localStorage.getItem('theme')||'light-theme'); renderAcademy(); };
    </script>
</body>
</html>
