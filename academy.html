<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="أكاديمية مشالى التعليمية - منصتك الأولى لتعلم صيانة الإلكترونيات، البرمجة، وأحدث التقنيات. دروس حصرية ومجانية.">
    <meta name="keywords" content="صيانة, إلكترونيات, برمجة, تعليم, دورات, مشالى, أكاديمية">
    <meta name="author" content="Mashily Store">
    <title>أكاديمية مشالى | تعلم واحترف</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* ثيمات الموقع */
        [data-theme="gold"] {
            --primary: #f59e0b;
        }
        
        [data-theme="blue"] {
            --primary: #3b82f6;
        }
        
        [data-theme="green"] {
            --primary: #10b981;
        }
        
        [data-theme="red"] {
            --primary: #ef4444;
        }
        
        [data-theme="purple"] {
            --primary: #8b5cf6;
        }
        
        [data-theme="pink"] {
            --primary: #ec4899;
        }
        
        [data-theme="dark"] {
            --primary: #f59e0b;
            --light: #1e293b;
            --surface: #334155;
            --border: #475569;
            --text: #f1f5f9;
            --card: #334155;
        }
    </style>
</head>
<body>
    <!-- الهيدر -->
    <header>
        <div class="header-top" style="padding: 10px 20px;">
            <a href="index.html" class="logo" style="font-size: 1.5rem;">
                ⚡ متجر مشالى
            </a>
            <div style="display: flex; gap: 15px; align-items: center;">
                <a href="index.html" style="text-decoration: none; color: var(--text); font-weight: bold; font-size: 0.9rem;">
                    <i class="fas fa-store"></i> المتجر
                </a>
                <!-- أيقونة الثيمات -->
                <button onclick="toggleThemeMenu(event)" style="background:none; border:none; cursor:pointer; font-size:1.2rem; color:var(--primary); position: relative;">
                    <i id="theme-icon" class="fas fa-palette"></i>
                </button>
            </div>
        </div>
        <!-- قائمة الثيمات المنسدلة -->
        <div id="theme-menu" style="position:absolute; top:50px; left:20px; background:var(--card); border:1px solid var(--border); border-radius:10px; padding:8px; display:none; z-index:2000; box-shadow: 0 5px 15px rgba(0,0,0,0.1); min-width: 140px;">
            <button onclick="setTheme('gold')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #f59e0b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">⭐</span>
                ذهبي
            </button>
            <button onclick="setTheme('blue')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #3b82f6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">●</span>
                أزرق
            </button>
            <button onclick="setTheme('green')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #10b981; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">🍃</span>
                أخضر
            </button>
            <button onclick="setTheme('red')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #ef4444; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">❤️</span>
                أحمر
            </button>
            <button onclick="setTheme('purple')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #8b5cf6; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">🌙</span>
                بنفسجي
            </button>
            <button onclick="setTheme('pink')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s;">
                <span style="width: 20px; height: 20px; background: #ec4899; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">💗</span>
                وردي
            </button>
            <button onclick="setTheme('dark')" style="display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; border: none; background: none; cursor: pointer; border-radius: 6px; color: var(--text); font-size: 0.85rem; transition: background 0.2s; border-top: 1px solid var(--border); margin-top: 4px;">
                <span style="width: 20px; height: 20px; background: #1e293b; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 0.7rem;">🌙</span>
                داكن
            </button>
        </div>
    </header>

    <!-- القسم الترحيبي (Hero Section) -->
    <div class="academy-hero">
        <div class="hero-content">
            <div class="hero-icon"><i class="fas fa-graduation-cap"></i></div>
            <h1>أكاديمية مشالى التعليمية</h1>
            <p>منصتك الأولى لتعلم صيانة الإلكترونيات، البرمجة، وأحدث التقنيات. محتوى حصري ومميز بانتظارك.</p>
            <div class="hero-stats">
                <span><i class="fas fa-video"></i> +50 درس</span>
                <span><i class="fas fa-users"></i> +1000 طالب</span>
                <span><i class="fas fa-certificate"></i> شهادات معتمدة</span>
            </div>
        </div>
    </div>

    <!-- أدوات البحث والفلترة -->
    <div class="academy-controls">
        <div class="search-box">
            <i class="fas fa-search"></i>
            <input type="text" id="academy-search" placeholder="ابحث عن درس معين..." onkeyup="searchAcademy()">
        </div>
        
        <!-- قائمة الترتيب -->
        <div class="academy-sort-container">
            <select id="academy-sort" onchange="sortAcademyVideos()">
                <option value="newest">📅 الأحدث أولاً</option>
                <option value="oldest">📅 الأقدم أولاً</option>
                <option value="most_viewed">🔥 الأكثر مشاهدة</option>
                <option value="most_liked">👍 الأكثر إعجاباً</option>
            </select>
        </div>

        <div id="academy-cats" class="cat-nav-scroll" style="justify-content: center;">
            <!-- سيتم ملء الأقسام هنا بالجافاسكريبت -->
        </div>
    </div>

    <!-- شبكة الفيديوهات -->
    <main class="video-grid" id="academy-grid">
        <!-- سيتم عرض الفيديوهات هنا -->
        <div class="loader" style="grid-column: 1/-1; margin: 50px auto;"></div>
    </main>

    <!-- مشغل الفيديو المنبثق -->
    <div id="video-player-modal" class="video-modal-overlay" onclick="if(event.target === this) closeVideoModal()">
        <div class="video-modal-content">
            <button class="close-video-btn" onclick="closeVideoModal()">✕</button>
            <div id="video-frame-container" class="video-frame-container">
                <!-- سيتم وضع الفيديو هنا -->
            </div>
            <div id="video-progress-container" class="video-progress-container">
                <div id="video-progress-bar" class="video-progress-bar"></div>
            </div>
            <div id="video-attachments-container" class="video-attachments"></div>
            
            <!-- قسم التفاعلات (لايك وتعليقات) -->
            <div class="video-interactions">
                <!-- شريط تقدم المستخدم -->
                <div class="user-profile-bar">
                    <div class="user-info">
                        <i class="fas fa-user-astronaut"></i>
                        <span id="profile-username">زائر</span>
                        <button id="edit-username-btn" onclick="changeUsername()" title="تغيير اسمك"><i class="fas fa-pencil-alt"></i></button>
                    </div>
                    <div class="level-info">
                        <span id="profile-level" class="level-badge">مبتدئ</span>
                        <div class="progress-container">
                            <div id="profile-progress" class="progress-bar"></div>
                        </div>
                        <span id="profile-points">0 / 100 نقطة</span>
                    </div>
                </div>
                <div class="video-actions">
                    <button id="video-like-btn" class="action-btn" onclick="toggleVideoLike()">
                        <i class="far fa-thumbs-up"></i> <span id="video-like-count">0</span> أعجبني
                    </button>
                    <button id="video-dislike-btn" class="action-btn" onclick="toggleVideoDislike()">
                        <i class="far fa-thumbs-down"></i> <span id="video-dislike-count">0</span> لم يعجبني
                    </button>
                    <button id="video-share-btn" class="action-btn" onclick="shareAcademyVideo()">
                        <i class="fas fa-share"></i> مشاركة
                    </button>
                </div>
                <div class="comments-section">
                    <h3 style="color:white; font-size:1rem; margin-bottom:10px; border-bottom:1px solid #333; padding-bottom:5px;">التعليقات</h3>
                    <div class="comment-form">
                        <input type="text" id="comment-input" placeholder="أضف تعليقاً..." onkeypress="if(event.key==='Enter') submitComment()">
                        <button onclick="submitComment()" class="btn-send"><i class="fas fa-paper-plane"></i></button>
                    </div>
                    <div id="comments-list" class="comments-list"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- الفوتر -->
    <footer style="text-align: center; padding: 20px; color: var(--text-light); margin-top: 50px; border-top: 1px solid var(--border);">
        <p>© 2024 أكاديمية مشالى - جميع الحقوق محفوظة</p>
    </footer>

    <script src="script.js"></script>
    <script>
        // تشغيل الأكاديمية عند التحميل
        window.addEventListener('load', initAcademyPage);
        
        // تحميل الثيم المحفوظ
        document.addEventListener('DOMContentLoaded', function() {
            const savedTheme = localStorage.getItem('mashily_theme');
            if (savedTheme) {
                document.documentElement.setAttribute('data-theme', savedTheme);
            }
        });
        
        // وظيفة تغيير الثيم
        function setTheme(themeName) {
            localStorage.setItem('mashily_theme', themeName);
            document.documentElement.setAttribute('data-theme', themeName);
            document.getElementById('theme-menu').style.display = 'none';
        }
        
        // وظيفة فتح/إغلاق قائمة الثيمات
        function toggleThemeMenu(event) {
            event.stopPropagation();
            const menu = document.getElementById('theme-menu');
            if (menu.style.display === 'none' || menu.style.display === '') {
                menu.style.display = 'block';
            } else {
                menu.style.display = 'none';
            }
        }
        
        // إغلاق قائمة الثيمات عند النقر خارجها
        document.addEventListener('click', function(event) {
            const themeMenu = document.getElementById('theme-menu');
            const themeButton = event.target.closest('button[onclick="toggleThemeMenu(event)"]');
            
            if (themeMenu && themeMenu.style.display === 'block' && !themeButton) {
                if (!event.target.closest('#theme-menu')) {
                    themeMenu.style.display = 'none';
                }
            }
        });
    </script>
</body>
</html>
