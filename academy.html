<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية مشالى التعليمية</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <header style="background: var(--card); border-bottom: 2px solid var(--primary);">
        <div class="header-top" style="display: flex; justify-content: space-between; align-items: center;">
            <a href="index.html" style="text-decoration:none; color:var(--text); font-weight:bold; font-size:0.9rem;">
                <i class="fas fa-arrow-right"></i> العودة للمتجر
            </a>
            <h3 style="color:var(--primary); margin:0;">📺 أكاديمية مشالى</h3>
            <div style="width:80px;"></div> </div>
    </header>

    <div class="cat-nav-scroll" id="v-cats" style="background:#fff;"></div>

    <main class="products-grid" id="v-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; padding: 20px;">
        </main>

    <script>
        // جلب فيديوهات الأكاديمية المخزنة
        const vids = JSON.parse(localStorage.getItem('academyVideos')) || [];

        function renderAcademy(filter = 'الكل') {
            const catNav = document.getElementById('v-cats');
            const grid = document.getElementById('v-grid');

            // 1. توليد أزرار الأقسام تلقائياً
            const cats = ['الكل', ...new Set(vids.map(v => v.category).filter(c => c))];
            catNav.innerHTML = cats.map(c => `
                <button class="cat-btn-chip ${filter === c ? 'active' : ''}" 
                        onclick="renderAcademy('${c}')">
                    ${c}
                </button>
            `).join('');

            // 2. تصفية وعرض الفيديوهات
            const filtered = filter === 'الكل' ? vids : vids.filter(v => v.category === filter);
            
            if(filtered.length === 0) {
                grid.innerHTML = `<div style="text-align:center; grid-column: 1/-1; padding:50px; opacity:0.5;">لا توجد فيديوهات في هذا القسم حالياً</div>`;
                return;
            }

            grid.innerHTML = filtered.map(v => {
                // استخراج معرف الفيديو من رابط يوتيوب بشكل ذكي
                let videoId = v.url.split('v=')[1] || v.url.split('/').pop();
                if(videoId.includes('&')) videoId = videoId.split('&')[0];

                return `
                    <div class="product-card" style="padding:0; overflow:hidden; background:#fff;">
                        <div style="position:relative; padding-bottom:56.25%; height:0;">
                            <iframe src="https://www.youtube.com/embed/${videoId}" 
                                    style="position:absolute; top:0; left:0; width:100%; height:100%; border:0;" 
                                    allowfullscreen></iframe>
                        </div>
                        <div style="padding:15px; text-align:right;">
                            <h4 style="margin:0 0 10px 0; font-size:1rem; color:var(--text);">${v.title}</h4>
                            <span style="background:rgba(230, 126, 34, 0.1); color:var(--primary); padding:3px 10px; border-radius:15px; font-size:0.75rem; font-weight:bold;">
                                <i class="fas fa-tag"></i> ${v.category}
                            </span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        // التشغيل عند تحميل الصفحة
        window.onload = () => renderAcademy();
    </script>
</body>
</html>
