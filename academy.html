<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أكاديمية مشالى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background:#e67e22; color:white; padding:15px; text-align:center;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <a href="index.html" style="color:white; text-decoration:none;">🔙 المتجر</a>
            <h3>📺 أكاديمية مشالى للتعلم</h3>
            <div style="width:20px;"></div>
        </div>
    </header>

    <div class="cat-nav-scroll" id="v-cats"></div>
    <main class="products-grid" id="v-grid" style="grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));"></main>

    <script>
        const vids = JSON.parse(localStorage.getItem('academyVideos')) || [];
        function render(f = 'الكل') {
            const cats = ['الكل', ...new Set(vids.map(v => v.category).filter(c => c))];
            document.getElementById('v-cats').innerHTML = cats.map(c => `<button class="cat-btn-chip" onclick="render('${c}')" style="${f==c?'background:#e67e22;color:white':''}">${c}</button>`).join('');
            
            const filtered = f === 'الكل' ? vids : vids.filter(v => v.category === f);
            document.getElementById('v-grid').innerHTML = filtered.map(v => `
                <div class="product-card">
                    <iframe width="100%" height="180" src="https://www.youtube.com/embed/${v.url.split('v=')[1] || v.url.split('/').pop()}" frameborder="0" allowfullscreen style="border-radius:8px;"></iframe>
                    <h5 style="margin-top:12px;">${v.title}</h5>
                    <small style="color:#e67e22;">${v.category}</small>
                </div>
            `).join('');
        }
        window.onload = () => render();
    </script>
</body>
</html>
