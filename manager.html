<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشالى | الإدارة الكاملة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background:#f0f2f5; padding:15px; font-family: 'Cairo', sans-serif; }
        .admin-container { max-width: 1100px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; }
        h3, h4 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; }
        .btn-save:hover { background: #219150; }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
        .grid-half { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .grid-half { grid-template-columns: 1fr; } }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .item-row img { width: 40px; height: 40px; object-fit: contain; margin-left: 10px; }
        .delete-btn { color: #e74c3c; cursor: pointer; border: none; background: none; font-size: 1.1rem; }
    </style>
</head>
<body>

<div class="admin-container">
    <div id="auth-screen" style="text-align:center; padding-top:100px;">
        <div class="card" style="max-width:400px; margin:auto;">
            <i class="fas fa-lock fa-3x" style="color:var(--primary); margin-bottom:15px;"></i>
            <h3>دخول الإدارة</h3>
            <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور">
            <button class="btn-save" onclick="checkPass()">دخول</button>
            <p><a href="index.html" style="color:#666; text-decoration:none;">العودة للموقع</a></p>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="nav-bar">
            <span><i class="fas fa-user-cog"></i> مدير متجر مشالى</span>
            <button onclick="logout()" style="background:#e74c3c; color:white; border:none; padding:5px 15px; border-radius:5px; cursor:pointer;">خروج</button>
        </div>

        <div class="grid-half">
            <div class="card">
                <h4>📦 إضافة منتج جديد</h4>
                <input id="name" placeholder="اسم الصنف">
                <input id="price" type="number" placeholder="السعر (ج.م)">
                <textarea id="desc" placeholder="وصف الصنف (يظهر عند الضغط على الصورة في المتجر)"></textarea>
                <input id="cat" placeholder="القسم (رسيفرات، شاشات، قطع غيار...)">
                <label>صورة المنتج:</label>
                <input type="file" accept="image/*" id="img-input" onchange="handleImg(this)">
                <input type="hidden" id="img-base64">
                <button class="btn-save" onclick="addProduct()">حفظ المنتج</button>
            </div>

            <div class="card">
                <h4>📢 التحكم في المتجر</h4>
                <label>نص شريط الأخبار (الذي يتحرك بالأسفل):</label>
                <input id="ticker-input" placeholder="اكتب أخبار المتجر هنا...">
                <button class="btn-save" style="background:#3498db;" onclick="saveTicker()">حفظ الشريط</button>

                <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">

                <label>قائمة الإشعارات المتغيرة (افصل بين الجمل بفاصلة ،):</label>
                <textarea id="proof-input" placeholder="مثال: أحمد اشترى رسيفر، محمد انضم للأكاديمية، تم شحن طلب جديد"></textarea>
                <button class="btn-save" style="background:#9b59b6;" onclick="saveProof()">حفظ قائمة الإشعارات</button>
            </div>
        </div>

        <div class="grid-half">
            <div class="card">
                <h4>📋 المنتجات الحالية (${JSON.parse(localStorage.getItem('storeProducts') || '[]').length})</h4>
                <div id="product-list" style="max-height:300px; overflow-y:auto;"></div>
            </div>

            <div class="card">
                <h4>🎥 دروس الأكاديمية</h4>
                <input id="v-title" placeholder="عنوان الدرس">
                <input id="v-url" placeholder="رابط فيديو يوتيوب">
                <button class="btn-save" style="background:#f39c12;" onclick="addVideo()">إضافة الدرس</button>
                <div id="video-list" style="margin-top:15px; max-height:150px; overflow-y:auto;"></div>
            </div>
        </div>

        <div class="card">
            <h4>📑 آخر الطلبات (التي تمت عبر واتساب)</h4>
            <div id="order-logs" style="background:#f9f9f9; padding:10px; border-radius:8px; font-size:0.9rem;"></div>
        </div>
    </div>
</div>

<script>
    // نظام الحماية
    function checkPass() {
        if(document.getElementById('admin-pass').value === '123') {
            sessionStorage.setItem('isAdmin', 'true');
            location.reload();
        } else { alert('كلمة المرور خطأ!'); }
    }

    if(sessionStorage.getItem('isAdmin') === 'true') {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('admin-panel').style.display = 'block';
    }

    function logout() { sessionStorage.clear(); location.reload(); }

    // معالجة الصورة
    function handleImg(input) {
        let reader = new FileReader();
        reader.onload = function(e) { document.getElementById('img-base64').value = e.target.result; };
        reader.readAsDataURL(input.files[0]);
    }

    // إدارة البيانات
    let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
    let videos = JSON.parse(localStorage.getItem('academyVideos')) || [];

    document.getElementById('ticker-input').value = localStorage.getItem('tickerText') || "";
    document.getElementById('proof-input').value = localStorage.getItem('proofText') || "";

    function addProduct() {
        const name = document.getElementById('name').value;
        const img = document.getElementById('img-base64').value;
        if(!name || !img) return alert('أكمل البيانات والصورة!');
        
        products.push({
            id: Date.now(),
            name: name,
            price: document.getElementById('price').value,
            desc: document.getElementById('desc').value,
            category: document.getElementById('cat').value,
            image: img
        });
        localStorage.setItem('storeProducts', JSON.stringify(products));
        alert('تم الحفظ!'); location.reload();
    }

    function saveTicker() {
        localStorage.setItem('tickerText', document.getElementById('ticker-input').value);
        alert('تم تحديث شريط الأخبار ✅');
    }

    function saveProof() {
        localStorage.setItem('proofText', document.getElementById('proof-input').value);
        alert('تم تحديث قائمة الإشعارات ✅');
    }

    function addVideo() {
        videos.push({ title: document.getElementById('v-title').value, url: document.getElementById('v-url').value });
        localStorage.setItem('academyVideos', JSON.stringify(videos));
        location.reload();
    }

    function renderAdmin() {
        document.getElementById('product-list').innerHTML = products.map(p => `
            <div class="item-row">
                <div style="display:flex; align-items:center;">
                    <img src="${p.image}">
                    <span>${p.name}</span>
                </div>
                <button class="delete-btn" onclick="deleteP(${p.id})"><i class="fas fa-trash"></i></button>
            </div>
        `).join('') || "لا يوجد منتجات";

        let orders = JSON.parse(localStorage.getItem('orderHistory')) || [];
        document.getElementById('order-logs').innerHTML = orders.map(o => `
            <div style="padding:5px; border-bottom:1px solid #ddd;">
                <small style="color:orange">${o.date}</small> - ${o.details}
            </div>
        `).join('') || "لا يوجد طلبات مسجلة";
    }

    function deleteP(id) {
        if(confirm('حذف هذا المنتج؟')) {
            products = products.filter(p => p.id !== id);
            localStorage.setItem('storeProducts', JSON.stringify(products));
            renderAdmin();
        }
    }

    renderAdmin();
</script>

</body>
</html>
