<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة مشالى</title>
    <link rel="stylesheet" href="style.css">
</head>
<body style="padding:20px; background:#eee;">
    <div style="max-width:800px; margin:auto; background:white; padding:30px; border-radius:15px;">
        <h2>لوحة التحكم</h2><br>
        <div style="display:flex; gap:10px; margin-bottom:20px;">
            <div style="flex:1; background:#3498db; color:white; padding:15px; border-radius:10px;">المنتجات: <b id="cnt">0</b></div>
            <div style="flex:1; background:#2ecc71; color:white; padding:15px; border-radius:10px;">القيمة: <b id="val">0</b></div>
        </div>
        <input type="text" id="n" placeholder="اسم المنتج" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="number" id="p" placeholder="السعر" style="width:100%; padding:10px; margin-bottom:10px;">
        <input type="text" id="img" placeholder="رابط الصورة" style="width:100%; padding:10px; margin-bottom:10px;">
        <select id="c" style="width:100%; padding:10px; margin-bottom:10px;"></select>
        <button onclick="add()" style="width:100%; padding:15px; background:#2ecc71; border:none; color:white; border-radius:10px; cursor:pointer;">إضافة المنتج</button>
        <hr style="margin:20px 0;">
        <div id="list"></div>
    </div>
    <script>
        if(sessionStorage.getItem('isAdmin')!=='true') window.location.href='login.html';
        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
        let cats = JSON.parse(localStorage.getItem('storeCats')) || ["تخزين", "إكسسوارات"];
        
        function refresh() {
            document.getElementById('cnt').innerText = products.length;
            document.getElementById('val').innerText = products.reduce((s,i)=>s+i.price,0);
            document.getElementById('c').innerHTML = cats.map(c=>`<option>${c}</option>`).join('');
            document.getElementById('list').innerHTML = products.map((p,i)=>`<div>${p.name} - ${p.price}ج <b onclick="del(${i})" style="color:red; cursor:pointer;">حذف</b></div>`).join('');
        }
        function add() {
            products.push({id: Date.now(), name: document.getElementById('n').value, price: parseInt(document.getElementById('p').value), image: document.getElementById('img').value, category: document.getElementById('c').value});
            localStorage.setItem('storeProducts', JSON.stringify(products)); refresh();
        }
        function del(i) { products.splice(i,1); localStorage.setItem('storeProducts', JSON.stringify(products)); refresh(); }
        refresh();
    </script>
</body>
</html>
