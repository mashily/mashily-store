<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إدارة مشالى | لوحة التحكم</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-sec { background:white; padding:20px; border-radius:15px; margin-bottom:20px; border:1px solid #ddd; }
        input, select, textarea { width:100%; padding:10px; margin:5px 0; border:1px solid #ccc; border-radius:8px; }
        .tab-btn { padding:10px 20px; cursor:pointer; border:none; background:#eee; }
        .tab-btn.active { background:var(--primary); color:white; }
    </style>
</head>
<body style="padding:20px; background:#f0f2f5; color:#333;">
    <div style="max-width:1000px; margin:auto;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
            <h2>🛠️ لوحة تحكم مشالى</h2>
            <a href="index.html" class="qty-btn">عودة للمتجر</a>
        </div>
        <br>
        
        <div class="admin-sec">
            <h3>📢 شريط الأخبار السفلي</h3>
            <input type="text" id="ticker-input" placeholder="اكتب جملة العروض هنا...">
            <button class="qty-btn" onclick="saveTicker()">حفظ الشريط</button>
        </div>

        <div class="admin-sec">
            <h3>📦 إضافة منتج جديد</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="p-name" placeholder="اسم المنتج">
                <input type="number" id="p-price" placeholder="السعر">
                <input type="text" id="p-img" placeholder="رابط الصورة">
                <input type="text" id="p-label" placeholder="ملصق (مثل: 🔥 عرض لفترة)">
                <select id="p-cat">
                    <option>تخزين</option><option>إكسسوارات</option><option>صوتيات</option>
                </select>
                <button class="qty-btn" style="background:#2ecc71;" onclick="addProduct()">إضافة المنتج</button>
            </div>
        </div>

        <div class="admin-sec" style="border-top:5px solid #e67e22;">
            <h3>🎓 إدارة مشالى التعليمية</h3>
            <div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">
                <input type="text" id="v-title" placeholder="عنوان الفيديو">
                <input type="text" id="v-url" placeholder="رابط يوتيوب">
                <input type="text" id="v-cat" placeholder="القسم (مثل: صيانة)">
                <textarea id="v-desc" placeholder="وصف بسيط"></textarea>
                <button class="qty-btn" style="background:#e67e22; grid-column:span 2;" onclick="addVideo()">إضافة الفيديو للأكاديمية</button>
            </div>
        </div>

        <div id="list-area" class="admin-sec">
            <h3>المنتجات والفيديوهات الحالية (للحذف)</h3>
            <div id="items-list"></div>
        </div>
    </div>

    <script>
        if(sessionStorage.getItem('isAdmin')!=='true') window.location.href='login.html';
        
        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
        let videos = JSON.parse(localStorage.getItem('academyVideos')) || [];

        function saveTicker() {
            localStorage.setItem('tickerText', document.getElementById('ticker-input').value);
            alert('تم الحفظ!');
        }

        function addProduct() {
            products.push({
                id: Date.now(),
                name: document.getElementById('p-name').value,
                price: parseInt(document.getElementById('p-price').value),
                image: document.getElementById('p-img').value,
                label: document.getElementById('p-label').value,
                category: document.getElementById('p-cat').value
            });
            localStorage.setItem('storeProducts', JSON.stringify(products));
            renderLists();
        }

        function addVideo() {
            videos.push({
                id: Date.now(),
                title: document.getElementById('v-title').value,
                url: document.getElementById('v-url').value,
                category: document.getElementById('v-cat').value,
                desc: document.getElementById('v-desc').value
            });
            localStorage.setItem('academyVideos', JSON.stringify(videos));
            renderLists();
        }

        function renderLists() {
            let html = '<h4>المنتجات:</h4>';
            products.forEach((p, i) => html += `<div style="padding:5px; border-bottom:1px solid #eee;">${p.name} <button onclick="delP(${i})" style="color:red;">حذف</button></div>`);
            html += '<h4 style="margin-top:20px;">الفيديوهات:</h4>';
            videos.forEach((v, i) => html += `<div style="padding:5px; border-bottom:1px solid #eee;">${v.title} <button onclick="delV(${i})" style="color:red;">حذف</button></div>`);
            document.getElementById('items-list').innerHTML = html;
        }

        function delP(i) { products.splice(i,1); localStorage.setItem('storeProducts', JSON.stringify(products)); renderLists(); }
        function delV(i) { videos.splice(i,1); localStorage.setItem('academyVideos', JSON.stringify(videos)); renderLists(); }
        
        document.getElementById('ticker-input').value = localStorage.getItem('tickerText') || "";
        renderLists();
    </script>
</body>
</html>
