<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشالى | الإدارة الآمنة</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background:#f0f2f5; padding:15px; font-family: 'Cairo', sans-serif; direction: rtl;}
        .admin-container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; }
        h4 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn-save:hover { opacity: 0.9; transform: translateY(-2px); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 7px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .grid-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
        .item-list { max-height: 350px; overflow-y: auto; background: #fafafa; border-radius: 8px; padding: 10px; border: 1px solid #eee; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 8px; border-radius: 8px; }
        .action-btns { display: flex; gap: 12px; font-size: 1.1rem; }
        .edit-i { color: #3498db; cursor: pointer; }
        .del-i { color: #e74c3c; cursor: pointer; }
        .lock-badge { background: #e74c3c; color: white; padding: 2px 6px; border-radius: 4px; font-size: 0.6rem; margin-right: 5px;}
    </style>
</head>
<body>

<div class="admin-container">
    <div id="auth-screen" style="text-align:center; padding-top:80px;">
        <div class="card" style="max-width:400px; margin:auto; border-top: 5px solid var(--primary);">
            <i class="fas fa-user-lock fa-4x" style="color:var(--primary); margin-bottom:15px;"></i>
            <h3>دخول الإدارة</h3>
            <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور">
            <button class="btn-save" onclick="checkPass()">دخول</button>
            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">
                    <i class="fas fa-arrow-right"></i> العودة للموقع الأساسي
                </a>
            </div>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="nav-bar">
            <span>⚙️ لوحة تحكم مشالى (نظام التشفير)</span>
            <div style="display:flex; gap:10px;">
                <a href="index.html" class="logout-btn" style="background:#3498db; text-decoration:none;">🛍️ المتجر</a>
                <a href="academy.html" class="logout-btn" style="background:#f39c12; text-decoration:none;">🎓 الأكاديمية</a>
                <button class="logout-btn" onclick="logoutAdmin()">خروج <i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h4 id="p-title">📦 إدارة المنتجات</h4>
                <input id="p-id" type="hidden">
                <input id="p-name" placeholder="اسم المنتج">
                <div style="display:flex; gap:10px;">
                    <input id="p-price" type="number" placeholder="السعر">
                    <select id="p-cat-select"></select>
                </div>
                <div style="display:flex; gap:10px;">
                    <select id="p-status-select"></select>
                    <input type="file" accept="image/*" onchange="handleImg(this, 'p-img-base64')" style="padding:7px;">
                </div>
                <textarea id="p-desc" placeholder="وصف المنتج..."></textarea>
                <input type="hidden" id="p-img-base64">
                <button class="btn-save" id="p-btn" onclick="saveProduct()">حفظ المنتج</button>
                <div class="item-list" id="product-list-area" style="margin-top:15px;"></div>
            </div>

            <div class="card" style="border-right: 4px solid #e74c3c;">
                <h4 id="v-title-head">🎥 إدارة الأكاديمية المشفرة</h4>
                <input id="v-id" type="hidden">
                <input id="v-name" placeholder="عنوان الفيديو">
                <input id="v-url" placeholder="رابط يوتيوب">
                
                <div style="display:flex; gap:10px;">
                    <select id="v-type" onchange="toggleLockField()">
                        <option value="free">🔓 درس مجاني</option>
                        <option value="locked">🔒 مطلوب كلمة سر</option>
                    </select>
                    <input id="v-pass" placeholder="كلمة سر الفيديو" style="display:none; background:#fff8f8;">
                </div>

                <div style="background:#f9f9f9; padding:10px; border-radius:8px; margin-bottom:10px;">
                    <label style="font-size:0.8rem; font-weight:bold;">صورة الدرس (Thumbnail):</label>
                    <input type="file" accept="image/*" onchange="handleImg(this, 'v-img-base64')" style="padding:5px;">
                    <input type="hidden" id="v-img-base64">
                </div>

                <button class="btn-save" id="v-btn" style="background:#e74c3c;" onclick="saveVideo()">حفظ الدرس في الأكاديمية</button>
                <div class="item-list" id="video-list-area" style="margin-top:15px;"></div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h4>📂 إدارة الأقسام والحالات</h4>
                <div style="display:flex; gap:5px; margin-bottom:10px;">
                    <input id="new-cat-input" placeholder="اسم قسم جديد">
                    <button class="btn-save" style="width:80px; background:#3498db;" onclick="addItem('cat')">إضافة</button>
                </div>
                <div class="item-list" id="cat-list-area" style="max-height:120px;"></div>
                <hr>
                <div style="display:flex; gap:5px;">
                    <input id="new-status-input" placeholder="اسم حالة جديدة (أصلي/ضمان)">
                    <button class="btn-save" style="width:80px; background:#f39c12;" onclick="addItem('status')">إضافة</button>
                </div>
                <div class="item-list" id="status-list-area" style="max-height:120px; margin-top:10px;"></div>
            </div>

            <div class="card">
                <h4>📢 إعدادات الموقع والإشعارات</h4>
                <input id="ticker-input" placeholder="شريط الأخبار المتحرك">
                <button class="btn-save" style="background:#2c3e50; margin-bottom:10px;" onclick="saveSetting('tickerText', 'ticker-input')">حفظ الشريط</button>
                <textarea id="proof-input" placeholder="إشعارات الزوار (افصل بفاصلة ،)"></textarea>
                <button class="btn-save" style="background:#8e44ad;" onclick="saveSetting('proofText', 'proof-input')">حفظ الإشعارات</button>
            </div>
        </div>
    </div>
</div>

<script>
    // دالة تشفير بسيطة (Hashing)
    function simpleHash(str) {
        let hash = 0;
        for (let i = 0; i < str.length; i++) {
            const char = str.charCodeAt(i);
            hash = ((hash << 5) - hash) + char;
            hash = hash & hash; 
        }
        return hash.toString();
    }

    // كلمة السر "123" مشفرة هي "48690"
    function checkPass() { 
        const input = document.getElementById('admin-pass').value;
        if(simpleHash(input) === '48690'){
            sessionStorage.setItem('mashily_admin','true');
            location.reload();
        } else {
            alert('كلمة المرور غير صحيحة!');
        }
    }

    function logoutAdmin() { sessionStorage.removeItem('mashily_admin'); location.reload(); }
    if(sessionStorage.getItem('mashily_admin')==='true'){document.getElementById('auth-screen').style.display='none';document.getElementById('admin-panel').style.display='block';}

    let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
    let categories = JSON.parse(localStorage.getItem('storeCategories')) || ['الكل', 'رسيفرات'];
    let statuses = JSON.parse(localStorage.getItem('storeStatuses')) || ['أصلي', 'ضمان سنة'];
    let videos = JSON.parse(localStorage.getItem('academyVideos')) || [];

    function init() {
        renderCats(); renderStatuses(); renderProducts(); renderVideos();
        document.getElementById('ticker-input').value = localStorage.getItem('tickerText') || "";
        document.getElementById('proof-input').value = localStorage.getItem('proofText') || "";
    }

    function toggleLockField() {
        document.getElementById('v-pass').style.display = document.getElementById('v-type').value === 'locked' ? 'block' : 'none';
    }

    function handleImg(input, targetId) { 
        let r = new FileReader(); 
        r.onload = (e) => document.getElementById(targetId).value = e.target.result; 
        if(input.files[0]) r.readAsDataURL(input.files[0]); 
    }

    // إدارة الأكاديمية
    function saveVideo() {
        const id = document.getElementById('v-id').value;
        const rawPass = document.getElementById('v-pass').value;
        
        // الحفاظ على البيانات القديمة (لايكات وتعليقات) عند التعديل
        let oldData = {};
        if(id) {
            oldData = videos.find(v => v.id == id) || {};
        }

        const videoObj = {
            id: id ? parseInt(id) : Date.now(),
            title: document.getElementById('v-name').value,
            url: document.getElementById('v-url').value,
            type: document.getElementById('v-type').value,
            password: rawPass ? simpleHash(rawPass) : "", // حفظ كلمة السر مشفرة
            image: document.getElementById('v-img-base64').value,
            category: "عام",
            likes: oldData.likes || 0,
            dislikes: oldData.dislikes || 0,
            comments: oldData.comments || []
        };
        if(!videoObj.title || !videoObj.url) return alert('أكمل بيانات الدرس');

        if(id) {
            let idx = videos.findIndex(v => v.id == id);
            videos[idx] = videoObj;
        } else {
            videos.push(videoObj);
        }
        localStorage.setItem('academyVideos', JSON.stringify(videos));
        location.reload();
    }

    function renderVideos() {
        document.getElementById('video-list-area').innerHTML = videos.map(v => `
            <div class="item-row">
                <span>${v.type==='locked'?'🔒':'🔓'} ${v.title}</span>
                <div class="action-btns">
                    <i class="fas fa-comments edit-i" style="color:#f39c12; font-size:0.9rem;" onclick="manageComments(${v.id})" title="إدارة التعليقات"></i>
                    <i class="fas fa-edit edit-i" onclick="editV(${v.id})"></i>
                    <i class="fas fa-trash del-i" onclick="deleteV(${v.id})"></i>
                </div>
            </div>`).join('');
    }

    function editV(id) {
        const v = videos.find(x => x.id == id);
        document.getElementById('v-id').value = v.id;
        document.getElementById('v-name').value = v.title;
        document.getElementById('v-url').value = v.url;
        document.getElementById('v-type').value = v.type;
        document.getElementById('v-pass').value = ""; // لا نعرض كلمة السر المشفرة
        document.getElementById('v-img-base64').value = v.image || "";
        toggleLockField();
        document.getElementById('v-btn').innerText = "تحديث الدرس";
    }

    function deleteV(id) { if(confirm('حذف الدرس؟')) { videos = videos.filter(v=>v.id!=id); localStorage.setItem('academyVideos', JSON.stringify(videos)); renderVideos(); } }

    // --- إدارة التعليقات من لوحة التحكم ---
    function manageComments(id) {
        const v = videos.find(x => x.id == id);
        if(!v.comments || v.comments.length === 0) return alert('لا توجد تعليقات لهذا الفيديو');
        
        let html = `<div style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:2000; display:flex; justify-content:center; align-items:center;">
            <div style="background:white; padding:20px; border-radius:10px; width:90%; max-width:500px; max-height:80vh; overflow-y:auto;">
                <h3>💬 إدارة تعليقات: ${v.title}</h3>
                <div style="margin-bottom:15px;">
                    ${v.comments.map((c, i) => `
                        <div style="background:#f9f9f9; padding:10px; margin-bottom:5px; border-radius:5px; display:flex; justify-content:space-between; align-items:center;">
                            <span><b>${c.user}:</b> ${c.text}</span>
                            <button onclick="removeComment(${id}, ${i})" style="background:#e74c3c; color:white; border:none; padding:2px 8px; border-radius:4px; cursor:pointer;">حذف</button>
                        </div>
                    `).join('')}
                </div>
                <button onclick="this.parentElement.parentElement.remove()" style="width:100%; padding:10px;">إغلاق</button>
            </div>
        </div>`;
        
        document.body.insertAdjacentHTML('beforeend', html);
    }

    // دالة مساعدة لحذف تعليق معين وتحديث الواجهة
    window.removeComment = function(vidId, commentIdx) {
        const vIdx = videos.findIndex(x => x.id == vidId);
        videos[vIdx].comments.splice(commentIdx, 1);
        localStorage.setItem('academyVideos', JSON.stringify(videos));
        document.querySelector('.action-btns').parentElement.parentElement.remove(); // إغلاق النافذة الحالية
        manageComments(vidId); // إعادة فتحها بالتحديث
        alert('تم حذف التعليق');
    };

    // بقية الوظائف
    function addItem(type) {
        if(type==='cat') { categories.push(document.getElementById('new-cat-input').value); localStorage.setItem('storeCategories', JSON.stringify(categories)); }
        else { statuses.push(document.getElementById('new-status-input').value); localStorage.setItem('storeStatuses', JSON.stringify(statuses)); }
        location.reload();
    }
    function renderCats() { 
        document.getElementById('cat-list-area').innerHTML = categories.map((c,i)=>`<div class="item-row"><span>${c}</span>${c!=='الكل'?`<i class="fas fa-trash del-i" onclick="deleteItem('cat',${i})"></i>`:''}</div>`).join('');
        document.getElementById('p-cat-select').innerHTML = categories.map(c=>`<option value="${c}">${c}</option>`).join('');
    }
    function renderStatuses() {
        document.getElementById('status-list-area').innerHTML = statuses.map((s,i)=>`<div class="item-row"><span>${s}</span><i class="fas fa-trash del-i" onclick="deleteItem('status',${i})"></i></div>`).join('');
        document.getElementById('p-status-select').innerHTML = statuses.map(s=>`<option value="${s}">${s}</option>`).join('');
    }
    function deleteItem(type, i) { if(type==='cat') categories.splice(i,1); else statuses.splice(i,1); localStorage.setItem(type==='cat'?'storeCategories':'storeStatuses', JSON.stringify(type==='cat'?categories:statuses)); location.reload(); }
    
    function saveProduct() {
        const id = document.getElementById('p-id').value;
        const pObj = {
            id: id ? parseInt(id) : Date.now(),
            name: document.getElementById('p-name').value,
            price: document.getElementById('p-price').value,
            category: document.getElementById('p-cat-select').value,
            status: document.getElementById('p-status-select').value,
            desc: document.getElementById('p-desc').value,
            image: document.getElementById('p-img-base64').value
        };
        if(id) { let idx=products.findIndex(p=>p.id==id); products[idx]=pObj; } else { products.push(pObj); }
        localStorage.setItem('storeProducts', JSON.stringify(products)); location.reload();
    }
    function renderProducts() { document.getElementById('product-list-area').innerHTML = products.map(p=>`<div class="item-row"><b>${p.name}</b><i class="fas fa-edit edit-i" onclick="editP(${p.id})"></i></div>`).join(''); }
    function editP(id) {
        const p = products.find(x => x.id == id);
        document.getElementById('p-id').value = p.id;
        document.getElementById('p-name').value = p.name;
        document.getElementById('p-price').value = p.price;
        document.getElementById('p-desc').value = p.desc;
        document.getElementById('p-cat-select').value = p.category;
        document.getElementById('p-status-select').value = p.status;
        window.scrollTo(0,0);
    }
    function saveSetting(key, inputId) { localStorage.setItem(key, document.getElementById(inputId).value); alert('تم الحفظ ✅'); }

    init();
</script>
</body>
</html>
