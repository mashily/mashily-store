<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>إحصائيات وإدارة مشالى</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-box { max-width: 1000px; margin: 20px auto; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); }
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--primary); color: white; padding: 20px; border-radius: 10px; text-align: center; }
        input, select { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body style="background:#f0f2f5;">
    <div class="admin-box">
        <div style="display:flex; justify-content:space-between;">
            <h2>لوحة الإدارة الذكية</h2>
            <a href="index.html" style="font-weight:bold; color:var(--primary);">العودة للمتجر</a>
        </div>
        <hr style="margin:20px 0;">

        <div class="stats-grid">
            <div class="stat-card" style="background:#3498db;">
                <h4 id="total-prods-count">0</h4>
                <p>إجمالي المنتجات</p>
            </div>
            <div class="stat-card" style="background:#2ecc71;">
                <h4 id="total-stock-value">0</h4>
                <p>قيمة البضاعة (ج.م)</p>
            </div>
            <div class="stat-card" style="background:#e67e22;">
                <h4 id="total-cats-count">0</h4>
                <p>عدد الأقسام</p>
            </div>
        </div>

        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:30px;">
            <div style="background:#f9f9f9; padding:20px; border-radius:10px;">
                <h3>إضافة منتج جديد</h3>
                <input type="text" id="p-name" placeholder="اسم المنتج">
                <input type="number" id="p-price" placeholder="السعر">
                <input type="text" id="p-img" placeholder="رابط الصورة">
                <input type="text" id="p-label" placeholder="ملصق (مثل: جديد، عرض..)">
                <select id="p-cat"></select>
                <button onclick="saveProduct()" style="width:100%; padding:15px; background:var(--primary); color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">حفظ في المتجر</button>
            </div>

            <div style="background:#f9f9f9; padding:20px; border-radius:10px;">
                <h3>إدارة الأقسام</h3>
                <input type="text" id="cat-name" placeholder="اسم القسم الجديد">
                <button onclick="addCat()" style="width:100%; padding:10px; margin-top:5px;">إضافة قسم</button>
                <div id="cats-list" style="margin-top:20px;"></div>
            </div>
        </div>
    </div>

    <script>
        if(sessionStorage.getItem('isAdmin') !== 'true') window.location.href = 'login.html';

        let prods = JSON.parse(localStorage.getItem('storeProducts')) || [];
        let cats = JSON.parse(localStorage.getItem('storeCats')) || ["الكل", "تخزين", "إكسسوارات"];

        function updateAdmin() {
            // تحديث الإحصائيات
            document.getElementById('total-prods-count').innerText = prods.length;
            document.getElementById('total-stock-value').innerText = prods.reduce((s, i) => s + i.price, 0).toLocaleString();
            document.getElementById('total-cats-count').innerText = cats.length;

            // تحديث القوائم
            document.getElementById('p-cat').innerHTML = cats.map(c => `<option value="${c}">${c}</option>`).join('');
            document.getElementById('cats-list').innerHTML = cats.map(c => `<div>- ${c}</div>`).join('');
        }

        function saveProduct() {
            let n = document.getElementById('p-name').value;
            let p = document.getElementById('p-price').value;
            let img = document.getElementById('p-img').value;
            if(!n || !p) return alert('أدخل البيانات');
            prods.push({ id: Date.now(), name: n, price: parseInt(p), image: img, category: document.getElementById('p-cat').value, label: document.getElementById('p-label').value });
            localStorage.setItem('storeProducts', JSON.stringify(prods));
            updateAdmin();
            alert('تم الحفظ');
        }

        function addCat() {
            let c = document.getElementById('cat-name').value;
            if(c) { cats.push(c); localStorage.setItem('storeCats', JSON.stringify(cats)); updateAdmin(); }
        }

        updateAdmin();
    </script>
</body>
</html>
