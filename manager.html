<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة تحكم مشالى | الإصدار النهائي الشامل</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background:#f0f2f5; padding:15px; font-family: 'Cairo', sans-serif; direction: rtl;}
        .admin-container { max-width: 1200px; margin: auto; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); border: 1px solid #e1e4e8; }
        h4 { margin-top: 0; color: #2c3e50; border-bottom: 2px solid var(--primary); display: inline-block; padding-bottom: 5px; margin-bottom: 15px; }
        input, select, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 8px; font-family: 'Cairo'; box-sizing: border-box; }
        .btn-save { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; font-size: 1rem; transition: 0.3s; }
        .btn-save:hover { opacity: 0.9; transform: translateY(-2px); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; color: white; padding: 15px 20px; border-radius: 12px; margin-bottom: 20px; }
        .logout-btn { background: #e74c3c; color: white; border: none; padding: 7px 15px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .grid-layout { display: grid; grid-template-columns: 1.5fr 1fr; gap: 20px; }
        @media (max-width: 900px) { .grid-layout { grid-template-columns: 1fr; } }
        .item-list { max-height: 350px; overflow-y: auto; background: #fafafa; border-radius: 8px; padding: 10px; border: 1px solid #eee; }
        .item-row { display: flex; align-items: center; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; background: #fff; margin-bottom: 8px; border-radius: 8px; }
        .action-btns { display: flex; gap: 12px; font-size: 1.1rem; }
        .edit-i { color: #3498db; cursor: pointer; }
        .del-i { color: #e74c3c; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-container">
    <div id="auth-screen" style="text-align:center; padding-top:80px;">
        <div class="card" style="max-width:400px; margin:auto; border-top: 5px solid var(--primary);">
            <i class="fas fa-user-lock fa-4x" style="color:var(--primary); margin-bottom:15px;"></i>
            <h3>دخول الإدارة</h3>
            <input type="password" id="admin-pass" placeholder="أدخل كلمة المرور">
            <button class="btn-save" onclick="checkPass()">دخول</button>
            <div style="margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px;">
                <a href="index.html" style="color: var(--primary); text-decoration: none; font-weight: bold;">
                    <i class="fas fa-arrow-right"></i> العودة للموقع الأساسي
                </a>
            </div>
        </div>
    </div>

    <div id="admin-panel" style="display:none;">
        <div class="nav-bar">
            <span>⚙️ لوحة تحكم مشالى الكاملة</span>
            <div style="display:flex; gap:10px;">
                <button class="logout-btn" onclick="logoutAdmin()">خروج <i class="fas fa-sign-out-alt"></i></button>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h4 id="p-title">📦 إدارة المنتجات</h4>
                <input id="p-id" type="hidden">
                <input id="p-name" placeholder="اسم المنتج">
                <div style="display:flex; gap:10px;">
                    <input id="p-price" type="number" placeholder="السعر">
                    <select id="p-cat-select" title="اختر القسم"></select>
                </div>
                <div style="display:flex; gap:10px;">
                    <select id="p-status-select" title="حالة المنتج (أصلي، ضمان...)"></select>
                    <input type="file" accept="image/*" onchange="handleImg(this)" style="padding:7px;">
                </div>
                <textarea id="p-desc" placeholder="وصف المنتج الذي يظهر عند الضغط..."></textarea>
                <input type="hidden" id="p-img-base64">
                <button class="btn-save" id="p-btn" onclick="saveProduct()">حفظ المنتج</button>
                <div class="item-list" id="product-list-area" style="margin-top:15px;"></div>
            </div>

            <div class="card">
                <h4 id="v-title-head">🎥 دروس الأكاديمية</h4>
                <input id="v-id" type="hidden">
                <input id="v-name" placeholder="عنوان الفيديو">
                <input id="v-url" placeholder="رابط يوتيوب">
                <button class="btn-save" id="v-btn" style="background:#e74c3c;" onclick="saveVideo()">حفظ الدرس</button>
                <div class="item-list" id="video-list-area" style="margin-top:10px; max-height:150px;"></div>

                <hr style="margin:20px 0;">
                
                <h4>📂 إدارة الأقسام</h4>
                <div style="display:flex; gap:5px;">
                    <input id="new-cat-input" placeholder="قسم جديد">
                    <button class="btn-save" style="width:80px; background:#3498db;" onclick="addCategory()">إضافة</button>
                </div>
                <div class="item-list" id="cat-list-area" style="margin-top:10px; max-height:150px;"></div>
            </div>
        </div>

        <div class="grid-layout">
            <div class="card">
                <h4>🛡️ إدارة مسميات الحالة (أصلي/ضمان)</h4>
                <p style="font-size:0.7rem; color:red;">هذه الكلمات تظهر كعلامة على المنتج</p>
                <div style="display:flex; gap:5px;">
                    <input id="new-status-input" placeholder="مثال: أصلي 100%">
                    <button class="btn-save" style="width:80px; background:#f39c12;" onclick="addStatus()">إضافة</button>
                </div>
                <div class="item-list" id="status-list-area" style="margin-top:10px; max-height:150px;"></div>
            </div>

            <div class="card">
                <h4>📢 إعدادات الموقع</h4>
                <input id="ticker-input" placeholder="شريط الأخبار">
                <button class="btn-save" style="background:#2c3e50; margin-bottom:10px;" onclick="saveTicker()">حفظ الشريط</button>
                <textarea id="proof-input" placeholder="إشعارات الزوار (افصل بفاصلة ،)"></textarea>
                <button class="btn-save" style="background:#8e44ad;" onclick="saveProof()">حفظ الإشعارات</button>
            </div>
        </div>
    </div>
</div>

<script>
    function checkPass() { if(document.getElementById('admin-pass').value==='123'){sessionStorage.setItem('mashily_admin','true');location.reload();}else alert('خطأ!');}
    function logoutAdmin() { sessionStorage.removeItem('mashily_admin'); location.reload(); }
    if(sessionStorage.getItem('mashily_admin')==='true'){document.getElementById('auth-screen').style.display='none';document.getElementById('admin-panel').style.display='block';}

    let products = JSON.parse(localStorage.getItem('storeProducts')) || [];
    let categories = JSON.parse(localStorage.getItem('storeCategories')) || ['الكل', 'رسيفرات'];
    let statuses = JSON.parse(localStorage.getItem('storeStatuses')) || ['أصلي', 'ضمان سنة', 'خصم لفترة'];
    let videos = JSON.parse(localStorage.getItem('academyVideos')) || [];

    function init() {
        renderCats(); renderProducts(); renderVideos(); renderStatuses();
        document.getElementById('ticker-input').value = localStorage.getItem('tickerText') || "";
        document.getElementById('proof-input').value = localStorage.getItem('proofText') || "";
    }

    // إدارة الحالات (أصلي / ضمان)
    function renderStatuses() {
        document.getElementById('status-list-area').innerHTML = statuses.map((s,i)=>`<div class="item-row"><span>${s}</span><i class="fas fa-trash del-i" onclick="deleteStatus(${i})"></i></div>`).join('');
        document.getElementById('p-status-select').innerHTML = statuses.map(s=>`<option value="${s}">${s}</option>`).join('');
    }
    function addStatus() {
        let val = document.getElementById('new-status-input').value;
        if(val) { statuses.push(val); localStorage.setItem('storeStatuses', JSON.stringify(statuses)); renderStatuses(); document.getElementById('new-status-input').value=''; }
    }
    function deleteStatus(i) { statuses.splice(i,1); localStorage.setItem('storeStatuses', JSON.stringify(statuses)); renderStatuses(); }

    // إدارة الأكاديمية
    function saveVideo() {
        const id=document.getElementById('v-id').value, name=document.getElementById('v-name').value, url=document.getElementById('v-url').value;
        if(id){ let idx=videos.findIndex(v=>v.id==id); videos[idx]={...videos[idx], title:name, url:url}; }
        else { videos.push({id:Date.now(), title:name, url:url}); }
        localStorage.setItem('academyVideos', JSON.stringify(videos)); location.reload();
    }
    function renderVideos() { document.getElementById('video-list-area').innerHTML = videos.map(v=>`<div class="item-row"><span>${v.title}</span><div class="action-btns"><i class="fas fa-edit edit-i" onclick="editV(${v.id})"></i><i class="fas fa-trash del-i" onclick="deleteV(${v.id})"></i></div></div>`).join('');}
    function editV(id) { const v=videos.find(x=>x.id==id); document.getElementById('v-id').value=v.id; document.getElementById('v-name').value=v.title; document.getElementById('v-url').value=v.url; }
    function deleteV(id) { if(confirm('حذف؟')){videos=videos.filter(v=>v.id!=id); localStorage.setItem('academyVideos',JSON.stringify(videos)); renderVideos();}}

    // المنتجات
    function handleImg(input) { let r=new FileReader(); r.onload=(e)=>document.getElementById('p-img-base64').value=e.target.result; r.readAsDataURL(input.files[0]);}
    function saveProduct() {
        const id=document.getElementById('p-id').value, name=document.getElementById('p-name').value, price=document.getElementById('p-price').value, desc=document.getElementById('p-desc').value, cat=document.getElementById('p-cat-select').value, status=document.getElementById('p-status-select').value, img=document.getElementById('p-img-base64').value;
        if(id){ let idx=products.findIndex(p=>p.id==id); products[idx]={...products[idx], name, price, desc, category:cat, status:status, image:img||products[idx].image};}
        else { products.push({id:Date.now(), name, price, desc, category:cat, status:status, image:img});}
        localStorage.setItem('storeProducts', JSON.stringify(products)); location.reload();
    }
    function renderProducts() { document.getElementById('product-list-area').innerHTML = products.map(p=>`<div class="item-row"><div style="display:flex; align-items:center; gap:8px;"><img src="${p.image}" style="width:30px;"><b>${p.name}</b></div><div class="action-btns"><i class="fas fa-edit edit-i" onclick="editP(${p.id})"></i><i class="fas fa-trash del-i" onclick="deleteP(${p.id})"></i></div></div>`).join('');}
    function editP(id) { const p=products.find(x=>x.id==id); document.getElementById('p-id').value=p.id; document.getElementById('p-name').value=p.name; document.getElementById('p-price').value=p.price; document.getElementById('p-desc').value=p.desc; document.getElementById('p-cat-select').value=p.category; document.getElementById('p-status-select').value=p.status||'أصلي'; window.scrollTo(0,0);}
    function deleteP(id) { if(confirm('حذف؟')){products=products.filter(p=>p.id!=id); localStorage.setItem('storeProducts',JSON.stringify(products)); renderProducts();}}

    // الأقسام والإعدادات
    function renderCats() { 
        document.getElementById('cat-list-area').innerHTML = categories.map((c,i)=>`<div class="item-row"><span>${c}</span>${c!=='الكل'?`<i class="fas fa-trash del-i" onclick="deleteCat(${i})"></i>`:''}</div>`).join('');
        document.getElementById('p-cat-select').innerHTML = categories.map(c=>`<option value="${c}">${c}</option>`).join('');
    }
    function addCategory() { let n=document.getElementById('new-cat-input').value; if(n){categories.push(n); localStorage.setItem('storeCategories', JSON.stringify(categories)); location.reload();}}
    function deleteCat(i) { categories.splice(i,1); localStorage.setItem('storeCategories', JSON.stringify(categories)); renderCats(); }
    function saveTicker() { localStorage.setItem('tickerText', document.getElementById('ticker-input').value); alert('تم ✅'); }
    function saveProof() { localStorage.setItem('proofText', document.getElementById('proof-input').value); alert('تم ✅'); }

    init();
</script>
</body>
</html>
