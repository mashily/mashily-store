<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | متجر مشالى</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Cairo', sans-serif; background: #f0f2f5; padding: 20px; }
        .admin-container { max-width: 900px; margin: 0 auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 5px; }
        .btn-add { background: #2ecc71; color: white; border: none; padding: 10px 20px; cursor: pointer; border-radius: 5px; font-weight: bold; width: 100%; }
        .product-list { margin-top: 30px; }
        .p-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #eee; }
        .btn-del { color: red; cursor: pointer; background: none; border: none; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header">
            <h2>لوحة إدارة المنتجات</h2>
            <a href="index.html" style="text-decoration: none; color: #3498db;"><i class="fas fa-store"></i> العودة للمتجر</a>
        </div>

        <div class="form-group">
            <label>اسم المنتج:</label>
            <input type="text" id="p-name" placeholder="مثال: هارد SSD">
        </div>
        <div class="form-group">
            <label>السعر (جنية):</label>
            <input type="number" id="p-price" placeholder="مثال: 1500">
        </div>
        <div class="form-group">
            <label>القسم:</label>
            <select id="p-cat">
                <option value="storage">أجهزة التخزين</option>
                <option value="accessories">إكسسوارات</option>
                <option value="smart">أجهزة ذكية</option>
                <option value="audio">صوتيات</option>
            </select>
        </div>
        <div class="form-group">
            <label>رابط الصورة:</label>
            <input type="text" id="p-img" placeholder="ضع رابط صورة المنتج هنا">
        </div>
        <button class="btn-add" onclick="addNewProduct()">إضافة المنتج للمتجر <i class="fas fa-plus"></i></button>

        <div class="product-list">
            <h3>المنتجات الحالية:</h3>
            <div id="admin-p-grid"></div>
        </div>
    </div>

    <script>
        if (sessionStorage.getItem('isAdmin') !== 'true') window.location.href = 'login.html';

        let products = JSON.parse(localStorage.getItem('storeProducts')) || [];

        function renderAdminProducts() {
            const container = document.getElementById('admin-p-grid');
            container.innerHTML = products.map((p, index) => `
                <div class="p-item">
                    <span>${p.name} - ${p.price} ج.م</span>
                    <button class="btn-del" onclick="deleteProduct(${index})"><i class="fas fa-trash-alt"></i> حذف</button>
                </div>
            `).join('');
        }

        function addNewProduct() {
            const name = document.getElementById('p-name').value;
            const price = document.getElementById('p-price').value;
            const cat = document.getElementById('p-cat').value;
            const img = document.getElementById('p-img').value || "https://via.placeholder.com/200";

            if (!name || !price) return alert('يرجى ملء الاسم والسعر');

            const newP = { id: Date.now(), name, price: parseInt(price), category: cat, image: img };
            products.push(newP);
            localStorage.setItem('storeProducts', JSON.stringify(products));
            renderAdminProducts();
            alert('تم إضافة المنتج بنجاح!');
        }

        function deleteProduct(index) {
            if (confirm('هل أنت متأكد من حذف هذا المنتج؟')) {
                products.splice(index, 1);
                localStorage.setItem('storeProducts', JSON.stringify(products));
                renderAdminProducts();
            }
        }

        renderAdminProducts();
    </script>
</body>
</html>
