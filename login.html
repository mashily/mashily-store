<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول المدير</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-wrap { height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 5px 20px rgba(0,0,0,0.1); width: 320px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; outline: none; }
        .btn { background: #3498db; color: white; border: none; width: 100%; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body class="light-theme">
    <div class="login-wrap">
        <div class="login-card">
            <h2 style="margin-bottom:20px;">دخول المدير</h2>
            <input type="text" id="user" placeholder="اسم المستخدم">
            <input type="password" id="pass" placeholder="كلمة المرور">
            <button class="btn" onclick="login()">دخول</button>
            <br><br>
            <a href="index.html" style="font-size: 0.8rem; color:#888; text-decoration:none;">العودة للمتجر</a>
        </div>
    </div>
    <script>
        function login() {
            if(document.getElementById('user').value === 'admin' && document.getElementById('pass').value === 'admin123') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'manager.html';
            } else { alert('خطأ في البيانات!'); }
        }
    </script>
</body>
</html>
