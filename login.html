<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دخول المدير | مشالى</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box { 
            max-width: 400px; 
            width: 90%;
            background: white; 
            padding: 40px 30px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
            text-align: center; 
        }
        .login-box h2 { color: #2c3e50; margin-bottom: 25px; }
        .input-group { position: relative; margin-bottom: 20px; }
        .input-group i { position: absolute; right: 10px; top: 12px; color: #3498db; }
        input { 
            width: 100%; 
            padding: 12px 40px 12px 10px; 
            border: 1px solid #ddd; 
            border-radius: 8px; 
            outline: none;
            transition: 0.3s;
        }
        input:focus { border-color: #3498db; box-shadow: 0 0 5px rgba(52, 152, 219, 0.3); }
        .login-btn { 
            background: #3498db; 
            color: white; 
            border: none; 
            width: 100%; 
            padding: 12px; 
            cursor: pointer; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 1rem;
            transition: 0.3s;
        }
        .login-btn:hover { background: #2980b9; }
        .back-store { display: block; margin-top: 20px; text-decoration: none; color: #7f8c8d; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <i class="fas fa-user-shield fa-3x" style="color: #3498db; margin-bottom: 15px;"></i>
        <h2>دخول الإدارة</h2>
        
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" id="username" placeholder="اسم المستخدم">
        </div>
        
        <div class="input-group">
            <i class="fas fa-lock"></i>
            <input type="password" id="password" placeholder="كلمة المرور">
        </div>
        
        <button class="login-btn" onclick="login()">دخول</button>
        
        <a href="index.html" class="back-store"><i class="fas fa-arrow-right"></i> العودة للمتجر</a>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            
            // البيانات لا تزال تعمل برمجياً لكنها غير مكتوبة في الصفحة
            if (user === 'admin' && pass === 'M@shily') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'manager.html';
            } else {
                alert('البيانات غير صحيحة!');
            }
        }
    </script>
</body>
</html>
