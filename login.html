<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول المدير</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-screen { height: 100vh; display: flex; align-items: center; justify-content: center; background: #2c3e50; }
        .login-card { background: white; padding: 40px; border-radius: 15px; width: 350px; text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="login-screen">
        <div class="login-card">
            <h2>دخول المدير</h2><br>
            <input type="text" id="u" placeholder="اسم المستخدم">
            <input type="password" id="p" placeholder="كلمة المرور">
            <button onclick="login()" class="btn-main" style="margin-top:15px;">دخول النظام</button>
            <p style="margin-top:20px; font-size:0.8rem; color:#888;">admin / admin123</p>
        </div>
    </div>
    <script>
        function login() {
            if(document.getElementById('u').value==='admin' && document.getElementById('p').value==='admin123') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href='manager.html';
            } else { alert('خطأ في البيانات!'); }
        }
    </script>
</body>
</html>
