<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>دخول المدير | مشالى</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-box { max-width: 400px; margin: 100px auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 20px rgba(0,0,0,0.1); text-align: center; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .login-btn { background: #3498db; color: white; border: none; width: 100%; padding: 12px; cursor: pointer; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body class="light-theme">
    <div class="login-box">
        <h2><i class="fas fa-lock"></i> دخول المدير</h2>
        <input type="text" id="username" placeholder="اسم المستخدم">
        <input type="password" id="password" placeholder="كلمة المرور">
        <button class="login-btn" onclick="login()">دخول</button>
        <p style="margin-top: 15px; font-size: 0.8rem; color: #888;">بيانات افتراضية: admin / admin123</p>
    </div>

    <script>
        function login() {
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;
            if (user === 'admin' && pass === 'admin123') {
                sessionStorage.setItem('isAdmin', 'true');
                window.location.href = 'manager.html';
            } else {
                alert('البيانات غير صحيحة!');
            }
        }
    </script>
</body>
</html>
