<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار نظام الفاتورة</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Cairo', sans-serif; background: #f5f5f5; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; }
        h1 { color: #0f172a; margin-bottom: 20px; }
        button { padding: 12px 24px; background: #667eea; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #764ba2; }
        .result { margin-top: 20px; padding: 15px; background: #f0f0f0; border-radius: 6px; }
        .success { color: #27ae60; }
        .error { color: #e74c3c; }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختبار نظام الفاتورة</h1>
        <button onclick="testInvoiceSystem()">اختبار إنشاء فاتورة</button>
        <button onclick="testQRCode()">اختبار QR Code</button>
        <button onclick="testWhatsApp()">اختبار WhatsApp</button>
        <div id="result" class="result"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode.js/1.0.0/qrcode.min.js"></script>
    <script>
        function testInvoiceSystem() {
            const result = document.getElementById('result');
            try {
                // اختبار الكائن البسيط
                const testInvoice = {
                    id: Date.now(),
                    invoiceNumber: '001',
                    date: new Date().toISOString().split('T')[0],
                    client: {
                        name: 'اختبار',
                        phone: '01001234567',
                        email: 'test@test.com',
                        address: 'القاهرة'
                    },
                    taxNumber: '123456789',
                    taxRate: 14,
                    discountRate: 10,
                    feesRate: 5,
                    items: [
                        { name: 'منتج 1', quantity: 2, price: 100, total: 200 },
                        { name: 'منتج 2', quantity: 1, price: 50, total: 50 }
                    ],
                    subtotal: 250,
                    discount: 25,
                    afterDiscount: 225,
                    fees: 11.25,
                    tax: 35,
                    total: 271.25,
                    notes: 'اختبار الملاحظات',
                    createdAt: new Date().toLocaleString('ar-EG')
                };

                // اختبار حسابات الفاتورة
                const calculation = 'الإجمالي الفرعي: ' + testInvoice.subtotal + 
                                  ' - خصم: ' + testInvoice.discount +
                                  ' = ' + testInvoice.afterDiscount +
                                  ' + رسوم: ' + testInvoice.fees +
                                  ' + ضريبة: ' + testInvoice.tax +
                                  ' = المجموع: ' + testInvoice.total;

                result.innerHTML = '<span class="success">✓ تم إنشاء الفاتورة بنجاح!</span><br><br>' + 
                                  '<strong>البيانات:</strong><br>' +
                                  'رقم الفاتورة: ' + testInvoice.invoiceNumber + '<br>' +
                                  'اسم العميل: ' + testInvoice.client.name + '<br>' +
                                  'الحسابات: ' + calculation;
            } catch (e) {
                result.innerHTML = '<span class="error">✗ خطأ: ' + e.message + '</span>';
            }
        }

        function testQRCode() {
            const result = document.getElementById('result');
            try {
                // إنشاء عنصر QR للاختبار
                const qrContainer = document.createElement('div');
                qrContainer.id = 'test-qr';
                qrContainer.style.padding = '10px';
                qrContainer.style.display = 'none';
                document.body.appendChild(qrContainer);

                // توليد QR Code
                new QRCode(qrContainer, {
                    text: 'Invoice: 001|Client: Test|Amount: 271.25|Date: 2024-01-01',
                    width: 130,
                    height: 130,
                    colorDark: '#0f172a',
                    colorLight: '#ffffff',
                    correctLevel: QRCode.CorrectLevel.H
                });

                result.innerHTML = '<span class="success">✓ تم توليد QR Code بنجاح!</span><br>' +
                                  'النص المشفر: Invoice: 001|Client: Test|Amount: 271.25|Date: 2024-01-01';
                
                // حذف العنصر المؤقت
                setTimeout(() => {
                    document.body.removeChild(qrContainer);
                }, 100);
            } catch (e) {
                result.innerHTML = '<span class="error">✗ خطأ في QR Code: ' + e.message + '</span>';
            }
        }

        function testWhatsApp() {
            const result = document.getElementById('result');
            try {
                const phone = '201001234567';
                let message = 'فاتورة من متجر مشالى%0A%0A';
                message += 'رقم الفاتورة: 001%0A';
                message += 'العميل: اختبار%0A%0A';
                message += 'البيانات:%0A';
                message += 'منتج 1 x2 = 200 ج.م%0A';
                message += 'منتج 2 x1 = 50 ج.م%0A%0A';
                message += 'الملخص المالي:%0A';
                message += 'الاجمالي الفرعي: 250 ج.م%0A';
                message += 'الخصم (10%): -25 ج.م%0A';
                message += 'الرسوم (5%): +11.25 ج.م%0A';
                message += 'الضريبة (14%): 35 ج.م%0A%0A';
                message += 'المجموع النهائي: 271.25 ج.م%0A%0A';
                message += 'شكرا لتعاملكم معنا';

                const whatsappURL = 'https://wa.me/' + phone + '?text=' + message;
                
                result.innerHTML = '<span class="success">✓ تم إنشاء رابط WhatsApp بنجاح!</span><br><br>' +
                                  '<strong>الرابط:</strong><br>' +
                                  '<a href="' + whatsappURL + '" target="_blank" style="color: #25d366; text-decoration: underline;">فتح في WhatsApp</a><br><br>' +
                                  '<strong>الرسالة:</strong><br>' +
                                  '<pre style="background: #f9f9f9; padding: 10px; border-radius: 4px; overflow-x: auto;">' + 
                                  message.replace(/%0A/g, '\n') + '</pre>';
            } catch (e) {
                result.innerHTML = '<span class="error">✗ خطأ في WhatsApp: ' + e.message + '</span>';
            }
        }

        // اختبار تلقائي عند التحميل
        window.addEventListener('load', function() {
            const result = document.getElementById('result');
            result.innerHTML = '<span class="success">✓ جميع المكتبات محملة بنجاح!</span>';
        });
    </script>
</body>
</html>
